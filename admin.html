```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

header{
    height:70px;
    background:#111;
    border-bottom:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.logo span{
    color:#ff1744;
}

.user-button{
    background:#ff1744;
    color:white;
    text-decoration:none;

    padding:11px 18px;

    border-radius:8px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;

    padding:40px 20px;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#888;
    margin-bottom:30px;
}

.card{
    background:#151515;
    border:1px solid #292929;

    border-radius:14px;

    padding:30px;
}

.form-group{
    margin-bottom:22px;
}

label.title-label{
    display:block;
    color:#ddd;
    font-size:14px;
    margin-bottom:8px;
}

input[type="text"],
textarea,
select{

    width:100%;

    background:#0d0d0d;

    color:#fff;

    border:1px solid #333;

    border-radius:8px;

    padding:13px;

    font-size:14px;

    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#ff1744;
}


/* FILE SELECTOR */

.file-selector{

    width:100%;

    border:2px dashed #444;

    background:#0d0d0d;

    border-radius:10px;

    padding:30px 20px;

    text-align:center;

    cursor:pointer;

    transition:.2s;
}

.file-selector:hover{

    border-color:#ff1744;

    background:#111;

}

.file-selector input{

    display:none;

}

.file-icon{

    font-size:42px;

    margin-bottom:10px;

}

.file-selector strong{

    display:block;

    font-size:15px;

    margin-bottom:7px;

}

.file-selector small{

    color:#777;

}


/* SELECTED FILE */

.selected-file{

    display:none;

    margin-top:12px;

    padding:12px;

    background:#10251b;

    border:1px solid #1f7549;

    border-radius:8px;

    color:#42d889;

    font-size:13px;

    word-break:break-all;

}


/* BUTTON */

.upload-button{

    width:100%;

    border:none;

    background:#ff1744;

    color:white;

    padding:15px;

    border-radius:8px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

.upload-button:hover{

    background:#e00038;

}

.upload-button:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* STATUS */

#status{

    margin-top:20px;

    padding:14px;

    border-radius:8px;

    display:none;

    font-size:14px;

    line-height:1.5;

}

.success{

    display:block !important;

    background:#10251b;

    border:1px solid #1f7549;

    color:#42d889;

}

.error{

    display:block !important;

    background:#2a1015;

    border:1px solid #8f2036;

    color:#ff6b86;

}


/* PROGRESS */

#progressContainer{

    display:none;

    margin-top:20px;

}

.progress-top{

    display:flex;

    justify-content:space-between;

    color:#aaa;

    font-size:13px;

    margin-bottom:8px;

}

.progress{

    width:100%;

    height:8px;

    background:#292929;

    border-radius:10px;

    overflow:hidden;

}

.progress-bar{

    height:100%;

    width:0%;

    background:#ff1744;

}


/* MOBILE */

@media(max-width:700px){

    header{
        padding:0 15px;
    }

    .container{
        padding:25px 15px;
    }

    .card{
        padding:20px;
    }

    h1{
        font-size:26px;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">
        Stream<span>X</span>
    </div>

    <a
        href="index.html"
        class="user-button"
    >
        🌐 User Website
    </a>

</header>


<main class="container">

    <h1>
        Admin Dashboard
    </h1>

    <p class="subtitle">
        Upload videos to StreamX.
    </p>


    <div class="card">


        <!-- TITLE -->

        <div class="form-group">

            <label class="title-label">
                Video Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter video title"
            >

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

            <label class="title-label">
                Category
            </label>

            <select id="category">

                <option value="Trending">
                    🔥 Trending
                </option>

                <option value="Entertainment">
                    🎭 Entertainment
                </option>

                <option value="Music">
                    🎵 Music
                </option>

                <option value="Sports">
                    ⚽ Sports
                </option>

                <option value="Gaming">
                    🎮 Gaming
                </option>

                <option value="Education">
                    🎓 Education
                </option>

                <option value="Lifestyle">
                    ✨ Lifestyle
                </option>

            </select>

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label class="title-label">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Describe your video..."
            ></textarea>

        </div>


        <!-- VIDEO -->

        <div class="form-group">

            <label class="title-label">
                Video File
            </label>

            <label class="file-selector">

                <input
                    type="file"
                    id="videoFile"
                    accept="video/*"
                >

                <div class="file-icon">
                    🎬
                </div>

                <strong>
                    Click to select a video
                </strong>

                <small>
                    MP4, WebM, MOV and other video formats
                </small>

            </label>


            <div
                id="selectedVideo"
                class="selected-file"
            ></div>

        </div>


        <!-- THUMBNAIL -->

        <div class="form-group">

            <label class="title-label">
                Thumbnail
            </label>

            <label class="file-selector">

                <input
                    type="file"
                    id="thumbnailFile"
                    accept="image/*"
                >

                <div class="file-icon">
                    🖼️
                </div>

                <strong>
                    Click to select thumbnail
                </strong>

                <small>
                    JPG, PNG or WebP
                </small>

            </label>


            <div
                id="selectedThumbnail"
                class="selected-file"
            ></div>

        </div>


        <!-- UPLOAD -->

        <button
            id="uploadButton"
            class="upload-button"
            type="button"
        >
            ⬆️ Upload Video
        </button>


        <!-- PROGRESS -->

        <div
            id="progressContainer"
        >

            <div class="progress-top">

                <span id="progressText">
                    Preparing...
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

        </div>


        <!-- STATUS -->

        <div id="status"></div>


    </div>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   FILE VARIABLES
===================================================== */

let selectedVideoFile = null;

let selectedThumbnailFile = null;


/* =====================================================
   VIDEO FILE SELECTION
===================================================== */

document
.getElementById("videoFile")
.addEventListener(
    "change",
    function(){

        selectedVideoFile =
        this.files[0] || null;


        const display =
        document.getElementById(
            "selectedVideo"
        );


        if(selectedVideoFile){

            display.textContent =
            "✓ Selected video: " +
            selectedVideoFile.name;

            display.style.display =
            "block";

        }
        else{

            display.textContent = "";

            display.style.display =
            "none";

        }

    }
);


/* =====================================================
   THUMBNAIL SELECTION
===================================================== */

document
.getElementById("thumbnailFile")
.addEventListener(
    "change",
    function(){

        selectedThumbnailFile =
        this.files[0] || null;


        const display =
        document.getElementById(
            "selectedThumbnail"
        );


        if(selectedThumbnailFile){

            display.textContent =
            "✓ Selected thumbnail: " +
            selectedThumbnailFile.name;

            display.style.display =
            "block";

        }
        else{

            display.textContent = "";

            display.style.display =
            "none";

        }

    }
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    const status =
    document.getElementById(
        "status"
    );


    status.textContent =
    message;


    status.className =
    type;

}


/* =====================================================
   PROGRESS
===================================================== */

function progress(
    percent,
    message
){

    document.getElementById(
        "progressBar"
    ).style.width =
    percent + "%";


    document.getElementById(
        "progressPercent"
    ).textContent =
    percent + "%";


    document.getElementById(
        "progressText"
    ).textContent =
    message;

}


/* =====================================================
   UPLOAD
===================================================== */

document
.getElementById("uploadButton")
.addEventListener(
    "click",
    uploadVideo
);


async function uploadVideo(){

    const title =
    document
    .getElementById("title")
    .value
    .trim();


    const description =
    document
    .getElementById("description")
    .value
    .trim();


    const category =
    document
    .getElementById("category")
    .value;


    if(!title){

        showStatus(
            "Please enter a title.",
            "error"
        );

        return;

    }


    if(!selectedVideoFile){

        showStatus(
            "Please select a video.",
            "error"
        );

        return;

    }


    if(!selectedThumbnailFile){

        showStatus(
            "Please select a thumbnail.",
            "error"
        );

        return;

    }


    const button =
    document.getElementById(
        "uploadButton"
    );


    button.disabled = true;


    document.getElementById(
        "progressContainer"
    ).style.display =
    "block";


    try{


        /* =========================================
           FILE NAMES
        ========================================= */

        const id =
        Date.now();


        const videoExtension =
        selectedVideoFile.name
        .split(".")
        .pop()
        .toLowerCase();


        const thumbnailExtension =
        selectedThumbnailFile.name
        .split(".")
        .pop()
        .toLowerCase();


        const videoPath =
        id +
        "-video." +
        videoExtension;


        const thumbnailPath =
        id +
        "-thumbnail." +
        thumbnailExtension;


        /* =========================================
           VIDEO UPLOAD
        ========================================= */

        progress(
            10,
            "Uploading video..."
        );


        const {
            error:videoError
        } =
        await supabase.storage
        .from("videos")
        .upload(
            videoPath,
            selectedVideoFile,
            {
                upsert:false
            }
        );


        if(videoError){

            throw new Error(
                "Video upload failed: " +
                videoError.message
            );

        }


        /* =========================================
           THUMBNAIL
        ========================================= */

        progress(
            55,
            "Uploading thumbnail..."
        );


        const {
            error:thumbnailError
        } =
        await supabase.storage
        .from("thumbnails")
        .upload(
            thumbnailPath,
            selectedThumbnailFile,
            {
                upsert:false
            }
        );


        if(thumbnailError){

            throw new Error(
                "Thumbnail upload failed: " +
                thumbnailError.message
            );

        }


        /* =========================================
           PUBLIC URLS
        ========================================= */

        progress(
            75,
            "Creating video record..."
        );


        const {
            data:videoPublic
        } =
        supabase.storage
        .from("videos")
        .getPublicUrl(
            videoPath
        );


        const {
            data:thumbnailPublic
        } =
        supabase.storage
        .from("thumbnails")
        .getPublicUrl(
            thumbnailPath
        );


        /* =========================================
           DATABASE
        ========================================= */

        const {
            error:databaseError
        } =
        await supabase
        .from("videos")
        .insert({

            title:title,

            description:description,

            category:category,

            video_url:
            videoPublic.publicUrl,

            thumbnail_url:
            thumbnailPublic.publicUrl,

            views:0

        });


        if(databaseError){

            throw new Error(
                "Database error: " +
                databaseError.message
            );

        }


        progress(
            100,
            "Upload complete!"
        );


        showStatus(
            "✅ Video uploaded successfully. Open the User Website to view it.",
            "success"
        );


        /* =========================================
           RESET
        ========================================= */

        document.getElementById(
            "title"
        ).value = "";


        document.getElementById(
            "description"
        ).value = "";


        document.getElementById(
            "category"
        ).value = "Trending";


        document.getElementById(
            "videoFile"
        ).value = "";


        document.getElementById(
            "thumbnailFile"
        ).value = "";


        selectedVideoFile = null;

        selectedThumbnailFile = null;


        document.getElementById(
            "selectedVideo"
        ).style.display =
        "none";


        document.getElementById(
            "selectedThumbnail"
        ).style.display =
        "none";


    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "❌ " + error.message,
            "error"
        );

    }
    finally{

        button.disabled = false;

    }

}

</script>

</body>

</html>
```
