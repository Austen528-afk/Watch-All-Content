<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

header{
    padding:18px 25px;
    background:#111;
    border-bottom:1px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#ff1744;
}

.admin-btn{
    background:#ff1744;
    color:white;
    text-decoration:none;

    padding:10px 15px;

    border-radius:8px;

    font-size:13px;
}

.admin-btn:hover{
    background:#e90035;
}


/* =========================
   CATEGORY NAVIGATION
========================= */

.category-section{
    padding:20px 25px;

    background:#0d0d0d;

    border-bottom:1px solid #222;
}

.category-title{
    font-size:14px;
    color:#999;
    margin-bottom:13px;
}

.categories{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding-bottom:5px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{

    flex-shrink:0;

    border:1px solid #333;

    background:#171717;

    color:#aaa;

    padding:10px 16px;

    border-radius:20px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}

.category-btn:hover{
    border-color:#ff1744;
    color:white;
}

.category-btn.active{
    background:#ff1744;
    border-color:#ff1744;
    color:white;
}


/* =========================
   MAIN
========================= */

.container{
    padding:25px;
}


/* =========================
   PAGE TITLE
========================= */

.page-heading{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}

.page-heading h1{
    font-size:22px;
}

.current-category{
    color:#ff1744;
}


/* =========================
   VIDEO GRID
========================= */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

    gap:20px;
}


/* =========================
   VIDEO CARD
========================= */

.card{

    background:#151515;

    border:1px solid #222;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}

.card:hover{

    transform:translateY(-3px);

    border-color:#444;
}

.thumbnail{

    width:100%;

    height:180px;

    background:#222;

    position:relative;

    overflow:hidden;
}

.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}

.play-overlay{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.25);

    opacity:0;

    transition:.2s;
}

.card:hover .play-overlay{
    opacity:1;
}

.play-circle{

    width:50px;
    height:50px;

    border-radius:50%;

    background:#ff1744;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:20px;
}

.category-label{

    position:absolute;

    top:10px;
    left:10px;

    background:rgba(0,0,0,.8);

    color:white;

    padding:5px 8px;

    border-radius:5px;

    font-size:10px;
}

.card-content{
    padding:15px;
}

.card h3{

    font-size:15px;

    margin-bottom:7px;
}

.card p{

    color:#999;

    font-size:12px;

    line-height:1.5;
}


/* =========================
   EMPTY / LOADING
========================= */

.message{

    text-align:center;

    padding:70px 20px;

    color:#777;

    grid-column:1/-1;
}

.message-icon{

    font-size:45px;

    margin-bottom:15px;
}


/* =========================
   PLAYER MODAL
========================= */

.player-modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.94);

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:1000;
}

.player-box{

    width:100%;

    max-width:1000px;

    position:relative;
}

.player-box video{

    width:100%;

    max-height:75vh;

    background:#000;

    border-radius:12px;

    display:block;
}

.player-info{

    padding:15px 0;
}

.player-info h2{

    font-size:20px;

    margin-bottom:7px;
}

.player-info p{

    color:#999;

    font-size:13px;
}

.close-btn{

    background:#ff1744;

    border:none;

    color:white;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    margin-bottom:10px;
}

.close-btn:hover{
    background:#e90035;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        padding:15px;
    }

    .logo{
        font-size:23px;
    }

    .admin-btn{
        padding:8px 11px;
    }

    .category-section{
        padding:15px;
    }

    .container{
        padding:15px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

    .thumbnail{
        height:210px;
    }

    .page-heading h1{
        font-size:19px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        Stream<span>X</span>
    </div>

    <a
        href="admin.html"
        class="admin-btn"
    >
        Admin
    </a>

</header>



<!-- =========================
     CATEGORY SELECTOR
========================= -->

<section class="category-section">

    <div class="category-title">
        Browse by category
    </div>

    <div class="categories">

        <button
            class="category-btn active"
            data-category="All"
            onclick="selectCategory('All', this)"
        >
            🎬 All Videos
        </button>

        <button
            class="category-btn"
            data-category="Trending"
            onclick="selectCategory('Trending', this)"
        >
            🔥 Trending
        </button>

        <button
            class="category-btn"
            data-category="Entertainment"
            onclick="selectCategory('Entertainment', this)"
        >
            🎭 Entertainment
        </button>

        <button
            class="category-btn"
            data-category="Music"
            onclick="selectCategory('Music', this)"
        >
            🎵 Music
        </button>

        <button
            class="category-btn"
            data-category="Sports"
            onclick="selectCategory('Sports', this)"
        >
            ⚽ Sports
        </button>

        <button
            class="category-btn"
            data-category="Gaming"
            onclick="selectCategory('Gaming', this)"
        >
            🎮 Gaming
        </button>

        <button
            class="category-btn"
            data-category="Education"
            onclick="selectCategory('Education', this)"
        >
            🎓 Education
        </button>

        <button
            class="category-btn"
            data-category="Lifestyle"
            onclick="selectCategory('Lifestyle', this)"
        >
            ✨ Lifestyle
        </button>

    </div>

</section>



<!-- =========================
     CONTENT
========================= -->

<main class="container">

    <div class="page-heading">

        <h1>
            <span id="currentCategory">
                All Videos
            </span>
        </h1>

    </div>


    <div
        id="videoGrid"
        class="video-grid"
    >

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            Loading videos...

        </div>

    </div>

</main>



<!-- =========================
     VIDEO PLAYER
========================= -->

<div
    class="player-modal"
    id="playerModal"
>

    <div class="player-box">

        <button
            class="close-btn"
            onclick="closePlayer()"
        >
            ✕ Close
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>


        <div class="player-info">

            <h2 id="playerTitle">
                Video
            </h2>

            <p id="playerDescription"></p>

        </div>

    </div>

</div>



<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allVideos = [];

let selectedCategory = "All";


/* =====================================================
   LOAD VIDEOS FROM SUPABASE
===================================================== */

async function loadVideos(){

    const grid =
        document.getElementById(
            "videoGrid"
        );


    grid.innerHTML = `

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            Loading videos...

        </div>

    `;


    try{

        const { data, error } =
            await supabase
            .from("videos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error){

            console.error(
                "Supabase error:",
                error
            );

            grid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>

                    <h3>
                        Unable to load videos
                    </h3>

                    <p style="margin-top:10px;">
                        ${escapeHTML(error.message)}
                    </p>

                </div>

            `;

            return;
        }


        allVideos = data || [];


        displayVideos();

    }

    catch(error){

        console.error(error);


        grid.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ⚠️
                </div>

                <h3>
                    Connection error
                </h3>

                <p style="margin-top:10px;">
                    Please refresh the page.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   CATEGORY SELECTION
===================================================== */

function selectCategory(
    category,
    button
){

    selectedCategory =
        category;


    /* Remove active state */

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    /* Activate selected button */

    button.classList.add(
        "active"
    );


    /* Update heading */

    document.getElementById(
        "currentCategory"
    ).textContent =
        category === "All"
            ? "All Videos"
            : category;


    /* Display matching videos */

    displayVideos();

}


/* =====================================================
   DISPLAY VIDEOS
===================================================== */

function displayVideos(){

    const grid =
        document.getElementById(
            "videoGrid"
        );


    let videosToDisplay;


    if(selectedCategory === "All"){

        videosToDisplay =
            allVideos;

    }else{

        videosToDisplay =
            allVideos.filter(
                video =>

                String(
                    video.category || ""
                ).toLowerCase() ===

                selectedCategory.toLowerCase()

            );

    }


    grid.innerHTML = "";


    /* No videos */

    if(
        !videosToDisplay ||
        videosToDisplay.length === 0
    ){

        grid.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    🎬
                </div>

                <h3>
                    No videos in this category
                </h3>

                <p style="margin-top:8px;">
                    Check another category.
                </p>

            </div>

        `;

        return;

    }


    /* Create cards */

    videosToDisplay.forEach(
        video => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const thumbnail =
                video.thumbnail_url ||

                "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


            card.innerHTML = `

                <div class="thumbnail">

                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="${escapeHTML(video.title || "Video")}"
                        loading="lazy"
                    >

                    <div class="category-label">

                        ${escapeHTML(
                            video.category ||
                            "Uncategorized"
                        )}

                    </div>


                    <div class="play-overlay">

                        <div class="play-circle">
                            ▶
                        </div>

                    </div>

                </div>


                <div class="card-content">

                    <h3>
                        ${escapeHTML(
                            video.title ||
                            "Untitled Video"
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            video.description ||
                            video.category ||
                            ""
                        )}
                    </p>

                </div>

            `;


            card.onclick =
                function(){

                    openPlayer(video);

                };


            grid.appendChild(card);

        }
    );

}


/* =====================================================
   OPEN VIDEO PLAYER
===================================================== */

function openPlayer(video){

    if(!video.video_url){

        alert(
            "This video does not have a valid video URL."
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    const title =
        document.getElementById(
            "playerTitle"
        );


    const description =
        document.getElementById(
            "playerDescription"
        );


    player.src =
        video.video_url;


    title.textContent =
        video.title ||
        "Video";


    description.textContent =
        video.description ||
        "";


    modal.style.display =
        "flex";


    player.play()
        .catch(
            () => {}
        );

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.removeAttribute(
        "src"
    );

    player.load();


    modal.style.display =
        "none";

}


/* =====================================================
   CLOSE PLAYER WHEN CLICKING BACKGROUND
===================================================== */

document
    .getElementById(
        "playerModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closePlayer();

            }

        }
    );


/* =====================================================
   HTML SECURITY HELPER
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /[&<>"']/g,

            function(character){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[character];

            }
        );

}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>

</body>
</html>
