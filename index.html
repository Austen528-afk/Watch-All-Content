<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
    height:70px;
    background:#111;
    border-bottom:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    position:sticky;
    top:0;

    z-index:100;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#ff1744;
}

.admin-button{
    background:#ff1744;
    color:#fff;

    text-decoration:none;

    padding:11px 18px;

    border-radius:8px;

    font-size:13px;
    font-weight:bold;
}

.admin-button:hover{
    background:#e90035;
}


/* MAIN */

.container{
    max-width:1500px;
    margin:auto;

    padding:30px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:30px;
}

.page-title p{
    color:#888;
    margin-top:7px;
    font-size:13px;
}


/* STATUS */

.status{
    background:#111;

    border:1px solid #292929;

    border-radius:10px;

    padding:14px 16px;

    margin-bottom:25px;

    color:#aaa;

    font-size:13px;
}

.status.success{
    border-color:#1d5b42;
    color:#50d69a;
}

.status.error{
    border-color:#7a2637;
    color:#ff6684;
}


/* CATEGORY FILTER */

.category-filter{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:25px;
    padding:14px;
    background:#111;
    border:1px solid #292929;
    border-radius:10px;
}

.category-filter label{
    color:#aaa;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.category-filter select{
    flex:1;
    max-width:320px;
    background:#080808;
    color:#fff;
    border:1px solid #303030;
    border-radius:8px;
    padding:11px 13px;
    outline:none;
    font-size:13px;
    cursor:pointer;
}

.category-filter select:focus{
    border-color:#ff1744;
}

.category-filter-count{
    color:#777;
    font-size:12px;
    margin-left:auto;
}

/* VIDEO GRID */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

    gap:20px;

}


/* CARD */

.video-card{

    background:#141414;

    border:1px solid #292929;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;

}

.video-card:hover{

    transform:translateY(-4px);

    border-color:#ff1744;

}


/* THUMBNAIL */

.thumbnail{

    width:100%;

    height:175px;

    background:#222;

    position:relative;

    overflow:hidden;

}

.thumbnail img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.play-icon{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:55px;
    height:55px;

    border-radius:50%;

    background:rgba(255,23,68,.95);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:21px;

    opacity:0;

    transition:.2s;

}

.video-card:hover .play-icon{

    opacity:1;

}


/* CARD CONTENT */

.video-info{

    padding:15px;

}

.video-info h3{

    font-size:16px;

    margin-bottom:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.category{

    color:#ff4568;

    font-size:11px;

    text-transform:uppercase;

    font-weight:bold;

    margin-bottom:8px;

}

.description{

    color:#888;

    font-size:12px;

    line-height:1.5;

}


/* EMPTY */

.empty{

    text-align:center;

    padding:70px 20px;

    color:#666;

}

.empty-icon{

    font-size:50px;

    margin-bottom:15px;

}


/* PLAYER */

.player{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.96);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:1000;

}

.player.active{

    display:flex;

}

.player-container{

    width:100%;

    max-width:1000px;

}

.player-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;

}

.player-title{

    font-size:18px;

    font-weight:bold;

}

.close{

    background:#ff1744;

    border:none;

    color:white;

    padding:10px 15px;

    border-radius:7px;

    cursor:pointer;

}

video{

    width:100%;

    max-height:75vh;

    background:#000;

    border-radius:10px;

}

.player-description{

    color:#888;

    font-size:13px;

    margin-top:12px;

}


/* MOBILE */

@media(max-width:600px){

    .category-filter{
        flex-direction:column;
        align-items:stretch;
    }

    .category-filter select{
        max-width:none;
        width:100%;
    }

    .category-filter-count{
        margin-left:0;
    }

    header{

        padding:0 15px;

    }

    .logo{

        font-size:22px;

    }

    .container{

        padding:20px 15px;

    }

    .video-grid{

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        Stream<span>X</span>
    </div>


</header>


<main class="container">


    <div class="page-title">

        <h1>
            Discover Videos
        </h1>

        <p>
            Watch the latest content uploaded to StreamX.
        </p>

    </div>


    <div
        id="status"
        class="status"
    >
        Connecting to StreamX...
    </div>


    <!-- CATEGORY FILTER -->
    <div class="category-filter">

        <label for="categoryFilter">
            Category
        </label>

        <select id="categoryFilter">
            <option value="All">
                🎬 All Videos
            </option>

            <option value="Black Content">
                🔥 Black Content
            </option>

            <option value="Whites content">
                🎭 Whites content
            </option>

            <option value="EMPTY">
                🎵 EMPTY
            </option>

            <option value="EMPTY">
                ⚽ EMPTY
            </option>

            <option value="EMPTY">
                🎮 EMPTY
            </option>

            <option value="EMPRY">
                🎓 Education
            </option>

            <option value="Lifestyle">
                ✨ Lifestyle
            </option>
        </select>

        <span
            id="categoryCount"
            class="category-filter-count"
        >
            All videos
        </span>

    </div>


    <div
        id="videoGrid"
        class="video-grid"
    ></div>


    <div
        id="empty"
        class="empty"
        style="display:none;"
    >

        <div class="empty-icon">
            🎬
        </div>

        <h2>
            No videos available
        </h2>

        <p style="margin-top:8px;">
            Videos uploaded by the administrator will appear here.
        </p>

    </div>


</main>


<!-- PLAYER -->

<div
    id="player"
    class="player"
>

    <div class="player-container">

        <div class="player-top">

            <div
                id="playerTitle"
                class="player-title"
            >
                Video
            </div>

            <button
                class="close"
                onclick="closePlayer()"
            >
                ✕ Close
            </button>

        </div>


        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>


        <div
            id="playerDescription"
            class="player-description"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const grid =
document.getElementById(
    "videoGrid"
);

const empty =
document.getElementById(
    "empty"
);

const status =
document.getElementById(
    "status"
);

const categoryFilter =
document.getElementById(
    "categoryFilter"
);

const categoryCount =
document.getElementById(
    "categoryCount"
);


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(
    message,
    type=""
){

    status.textContent =
        message;

    status.className =
        "status " + type;

}


/* =====================================================
   CREATE STORAGE URL
===================================================== */

function getVideoURL(value){

    if(!value)
        return null;


    /*
       If the database already contains
       a complete URL, use it.
    */

    if(
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ){

        return value;

    }


    /*
       Otherwise assume the value
       is a file path inside videos bucket.
    */

    const {
        data
    } =
    supabaseClient
        .storage
        .from("videos")
        .getPublicUrl(value);


    return data.publicUrl;

}


/* =====================================================
   CREATE THUMBNAIL URL
===================================================== */

function getThumbnailURL(value){

    if(!value)
        return null;


    if(
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "https://"
        )
    ){

        return value;

    }


    const {
        data
    } =
    supabaseClient
        .storage
        .from("thumbnails")
        .getPublicUrl(value);


    return data.publicUrl;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

    const selectedCategory =
        categoryFilter.value;

    showStatus(
        selectedCategory === "All"
            ? "Connecting to Supabase..."
            : "Loading " + selectedCategory + " videos..."
    );

    grid.innerHTML = "";

    empty.style.display =
        "none";


    console.log(
        "StreamX: requesting category:",
        selectedCategory
    );


    let query =
        supabaseClient
            .from("videos")
            .select("*");


    /*
       If a specific category is selected,
       only request videos belonging to
       that category from Supabase.
    */

    if(selectedCategory !== "All"){

        query =
            query.eq(
                "category",
                selectedCategory
            );

    }


    const result =
        await query.order(
            "created_at",
            {
                ascending:false
            }
        );


    const data =
        result.data;

    const error =
        result.error;


    console.log(
        "StreamX database result:",
        result
    );


    /* DATABASE ERROR */

    if(error){

        console.error(
            "Supabase database error:",
            error
        );


        showStatus(
            "❌ Database error: " +
            error.message,
            "error"
        );


        empty.style.display =
            "block";


        empty.innerHTML = `

            <div class="empty-icon">
                ⚠️
            </div>

            <h2>
                Could not load videos
            </h2>

            <p style="margin-top:10px;">
                ${escapeHTML(
                    error.message
                )}
            </p>

        `;

        categoryCount.textContent =
            "Unable to load";

        return;

    }


    console.log(
        "Videos found:",
        data
    );


    const videos =
        data || [];


    /*
       Update the category counter.
    */

    if(selectedCategory === "All"){

        categoryCount.textContent =
            videos.length +
            (
                videos.length === 1
                ? " video"
                : " videos"
            );

    }else{

        categoryCount.textContent =
            videos.length +
            (
                videos.length === 1
                ? " video"
                : " videos"
            ) +
            " in " +
            selectedCategory;

    }


    /* NO DATA */

    if(videos.length === 0){

        showStatus(
            selectedCategory === "All"
                ? "Connected successfully — no videos found."
                : "No videos found in " +
                  selectedCategory + "."
        );


        empty.style.display =
            "block";


        empty.innerHTML = `

            <div class="empty-icon">
                🎬
            </div>

            <h2>
                ${
                    selectedCategory === "All"
                    ? "No videos available"
                    : "No videos in " +
                      escapeHTML(selectedCategory)
                }
            </h2>

            <p style="margin-top:8px;">
                ${
                    selectedCategory === "All"
                    ? "Videos uploaded by the administrator will appear here."
                    : "Try selecting another category."
                }
            </p>

        `;

        return;

    }


    /* VIDEOS FOUND */

    showStatus(
        selectedCategory === "All"
            ? "✓ Connected — " +
              videos.length +
              " video(s) available."
            : "✓ Showing " +
              videos.length +
              " video(s) from " +
              selectedCategory + ".",
        "success"
    );


    videos.forEach(
        video => {

            createVideoCard(
                video
            );

        }
    );

}


/* =====================================================
   CREATE VIDEO CARD
===================================================== */

function createVideoCard(
    video
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "video-card";


    const thumbnail =
        getThumbnailURL(
            video.thumbnail_url
        );


    const title =
        video.title ||
        "Untitled Video";


    const category =
        video.category ||
        "General";


    const description =
        video.description ||
        "No description available.";


    card.innerHTML = `

        <div class="thumbnail">

            ${
                thumbnail
                ?
                `
                <img
                    src="${escapeHTML(thumbnail)}"
                    alt="${escapeHTML(title)}"
                    onerror="this.style.display='none'"
                >
                `
                :
                ""
            }

            <div class="play-icon">
                ▶
            </div>

        </div>


        <div class="video-info">

            <div class="category">
                ${escapeHTML(category)}
            </div>

            <h3>
                ${escapeHTML(title)}
            </h3>

            <div class="description">
                ${escapeHTML(description)}
            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        function(){

            openPlayer(
                video
            );

        }
    );


    grid.appendChild(
        card
    );

}


/* =====================================================
   OPEN PLAYER
===================================================== */

function openPlayer(
    video
){

    const url =
        getVideoURL(
            video.video_url
        );


    if(!url){

        alert(
            "This video does not have a video URL."
        );

        return;

    }


    console.log(
        "Playing video:",
        url
    );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    const modal =
        document.getElementById(
            "player"
        );


    document.getElementById(
        "playerTitle"
    ).textContent =
        video.title ||
        "Video";


    document.getElementById(
        "playerDescription"
    ).textContent =
        video.description ||
        "";


    player.src =
        url;


    modal.classList.add(
        "active"
    );


    player.play().catch(
        function(error){

            console.log(
                "Autoplay prevented:",
                error
            );

        }
    );

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

    const modal =
        document.getElementById(
            "player"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.removeAttribute(
        "src"
    );

    player.load();


    modal.classList.remove(
        "active"
    );

}


/* =====================================================
   CLOSE WITH ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closePlayer();

        }

    }
);


/* =====================================================
   CATEGORY FILTER
===================================================== */

categoryFilter.addEventListener(
    "change",
    function(){

        loadVideos();

    }
);


/* =====================================================
   START
===================================================== */

loadVideos();

</script>

</body>
</html>
