<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>StreamX</title>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

    background:#0d0d0d;

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

header{

    height:70px;

    padding:0 25px;

    background:#111;

    border-bottom:1px solid #292929;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:100;
}


.logo{

    font-size:28px;

    font-weight:900;
}


.logo span{

    color:#ff1744;
}


.admin-btn{

    background:#ff1744;

    color:white;

    text-decoration:none;

    padding:10px 16px;

    border-radius:8px;

    font-size:13px;

    font-weight:bold;

    transition:.2s;
}


.admin-btn:hover{

    background:#e90035;

}


/* =====================================================
   CATEGORY SECTION
===================================================== */

.category-section{

    padding:20px 25px;

    background:#0d0d0d;

    border-bottom:1px solid #222;
}


.category-title{

    color:#888;

    font-size:13px;

    margin-bottom:13px;
}


.categories{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding-bottom:4px;

    scrollbar-width:none;
}


.categories::-webkit-scrollbar{

    display:none;
}


.category-btn{

    flex-shrink:0;

    border:1px solid #333;

    background:#171717;

    color:#aaa;

    padding:10px 16px;

    border-radius:20px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}


.category-btn:hover{

    border-color:#ff1744;

    color:white;
}


.category-btn.active{

    background:#ff1744;

    border-color:#ff1744;

    color:white;
}


/* =====================================================
   MAIN
===================================================== */

.container{

    max-width:1600px;

    margin:auto;

    padding:25px;
}


/* =====================================================
   PAGE HEADING
===================================================== */

.page-heading{

    margin-bottom:20px;
}


.page-heading h1{

    font-size:23px;
}


.current-category{

    color:#ff1744;
}


/* =====================================================
   VIDEO GRID
===================================================== */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(260px,1fr)
        );

    gap:20px;
}


/* =====================================================
   VIDEO CARD
===================================================== */

.card{

    background:#151515;

    border:1px solid #252525;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}


.card:hover{

    transform:translateY(-3px);

    border-color:#444;
}


/* =====================================================
   THUMBNAIL
===================================================== */

.thumbnail{

    width:100%;

    height:180px;

    background:#222;

    position:relative;

    overflow:hidden;
}


.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


/* =====================================================
   CATEGORY LABEL
===================================================== */

.category-label{

    position:absolute;

    top:10px;

    left:10px;

    background:rgba(0,0,0,.8);

    color:white;

    padding:5px 8px;

    border-radius:5px;

    font-size:10px;
}


/* =====================================================
   PLAY BUTTON
===================================================== */

.play-overlay{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.3);

    opacity:0;

    transition:.2s;
}


.card:hover .play-overlay{

    opacity:1;
}


.play-circle{

    width:52px;

    height:52px;

    border-radius:50%;

    background:#ff1744;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;
}


/* =====================================================
   CARD CONTENT
===================================================== */

.card-content{

    padding:15px;
}


.card-content h3{

    font-size:15px;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.card-content p{

    color:#999;

    font-size:12px;

    line-height:1.5;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#777;
}


.message-icon{

    font-size:45px;

    margin-bottom:15px;
}


.message h3{

    color:#aaa;

    margin-bottom:5px;
}


.message p{

    max-width:700px;

    margin:auto;

    line-height:1.6;

    word-break:break-word;
}


/* =====================================================
   PLAYER MODAL
===================================================== */

.player-modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.96);

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:1000;
}


.player-box{

    width:100%;

    max-width:1000px;
}


.player-box video{

    width:100%;

    max-height:75vh;

    background:#000;

    border-radius:12px;

    display:block;
}


.close-btn{

    background:#ff1744;

    border:none;

    color:white;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    margin-bottom:10px;

    font-weight:bold;
}


.close-btn:hover{

    background:#e90035;
}


.player-info{

    padding-top:15px;
}


.player-info h2{

    font-size:20px;

    margin-bottom:8px;
}


.player-info p{

    color:#999;

    font-size:13px;

    line-height:1.5;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    header{

        height:60px;

        padding:0 15px;
    }


    .logo{

        font-size:23px;
    }


    .admin-btn{

        padding:8px 11px;

        font-size:12px;
    }


    .category-section{

        padding:15px;
    }


    .container{

        padding:15px;
    }


    .video-grid{

        grid-template-columns:1fr;
    }


    .thumbnail{

        height:210px;
    }


    .page-heading h1{

        font-size:20px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

```
<div class="logo">

    Stream<span>X</span>

</div>


<a
    href="admin.html"
    class="admin-btn"
>

    Admin

</a>
```

</header>

<!-- =====================================================
     CATEGORY NAVIGATION
===================================================== -->

<section class="category-section">

```
<div class="category-title">

    Browse by category

</div>


<div class="categories">


    <button
        class="category-btn active"
        onclick="selectCategory('All',this)"
    >

        🎬 All Videos

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Trending',this)"
    >

        🔥 Trending

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Entertainment',this)"
    >

        🎭 Entertainment

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Music',this)"
    >

        🎵 Music

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Sports',this)"
    >

        ⚽ Sports

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Gaming',this)"
    >

        🎮 Gaming

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Education',this)"
    >

        🎓 Education

    </button>


    <button
        class="category-btn"
        onclick="selectCategory('Lifestyle',this)"
    >

        ✨ Lifestyle

    </button>


</div>
```

</section>

<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<main class="container">

```
<div class="page-heading">

    <h1>

        <span
            id="currentCategory"
            class="current-category"
        >

            All Videos

        </span>

    </h1>

</div>


<div
    id="videoGrid"
    class="video-grid"
>

    <div class="message">

        <div class="message-icon">

            ⏳

        </div>


        <h3>

            Connecting to StreamX...

        </h3>


        <p>

            Loading videos from Supabase.

        </p>

    </div>

</div>
```

</main>

<!-- =====================================================
     VIDEO PLAYER
===================================================== -->

<div
    id="playerModal"
    class="player-modal"
>

```
<div class="player-box">


    <button
        class="close-btn"
        onclick="closePlayer()"
    >

        ✕ Close

    </button>


    <video
        id="videoPlayer"
        controls
        playsinline
    ></video>


    <div class="player-info">


        <h2
            id="playerTitle"
        >

            Video

        </h2>


        <p
            id="playerDescription"
        ></p>


    </div>

</div>
```

</div>

<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const videoGrid =
document.getElementById(
    "videoGrid"
);


const currentCategory =
document.getElementById(
    "currentCategory"
);


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(
    category = "All"
){

    /*
    Show loading message.
    */

    videoGrid.innerHTML = `

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h3>
                Loading videos...
            </h3>

            <p>
                Connecting to Supabase.
            </p>

        </div>

    `;


    console.log(
        "Loading category:",
        category
    );


    try{


        /*
        Start Supabase query.
        */

        let query =
            supabase
            .from("videos")
            .select(
                "*"
            );


        /*
        If category is not All,
        filter directly in Supabase.
        */

        if(
            category !== "All"
        ){

            query =
                query.eq(
                    "category",
                    category
                );

        }


        /*
        Order newest videos first.
        */

        query =
            query.order(
                "created_at",
                {
                    ascending:false
                }
            );


        /*
        Execute query.
        */

        const {
            data,
            error
        } = await query;


        /*
        Print result in browser console.
        */

        console.log(
            "Supabase data:",
            data
        );


        console.log(
            "Supabase error:",
            error
        );


        /*
        Handle Supabase error.
        */

        if(error){

            videoGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ❌
                    </div>

                    <h3>
                        Supabase Error
                    </h3>

                    <p>
                        ${escapeHTML(
                            error.message
                        )}
                    </p>

                    <p style="margin-top:12px;">
                        Error code:
                        ${escapeHTML(
                            error.code ||
                            "Unknown"
                        )}
                    </p>

                </div>

            `;

            return;

        }


        /*
        Check whether records exist.
        */

        if(
            !data ||
            data.length === 0
        ){

            videoGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        📭
                    </div>

                    <h3>
                        No videos found
                    </h3>

                    <p>
                        There are currently no videos
                        in ${escapeHTML(
                            category === "All"
                                ? "StreamX"
                                : category
                        )}.
                    </p>

                </div>

            `;

            return;

        }


        /*
        Display returned videos.
        */

        displayVideos(
            data
        );


    }

    catch(error){

        console.error(
            "JavaScript error:",
            error
        );


        videoGrid.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ❌
                </div>

                <h3>
                    Connection Error
                </h3>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "Unknown error"
                    )}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   CATEGORY SELECTION
===================================================== */

function selectCategory(
    category,
    button
){

    /*
    Remove active class
    from all buttons.
    */

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    /*
    Activate clicked button.
    */

    button.classList.add(
        "active"
    );


    /*
    Change page heading.
    */

    currentCategory.textContent =
        category === "All"
            ? "All Videos"
            : category;


    /*
    Load the selected
    category directly
    from Supabase.
    */

    loadVideos(
        category
    );

}


/* =====================================================
   DISPLAY VIDEOS
===================================================== */

function displayVideos(
    videos
){

    videoGrid.innerHTML = "";


    videos.forEach(
        function(video){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            /*
            Thumbnail.
            */

            const thumbnail =
                video.thumbnail_url ||
                "";


            /*
            Create card HTML.
            */

            card.innerHTML = `

                <div class="thumbnail">

                    ${
                        thumbnail

                        ?

                        `<img
                            src="${escapeHTML(
                                thumbnail
                            )}"
                            alt="${escapeHTML(
                                video.title ||
                                "Video"
                            )}"
                            loading="lazy"
                        >`

                        :

                        `<div
                            style="
                                width:100%;
                                height:100%;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                color:#777;
                                font-size:40px;
                            "
                        >
                            🎬
                        </div>`
                    }


                    <div class="category-label">

                        ${escapeHTML(
                            video.category ||
                            "Uncategorized"
                        )}

                    </div>


                    <div class="play-overlay">

                        <div class="play-circle">

                            ▶

                        </div>

                    </div>

                </div>


                <div class="card-content">

                    <h3>

                        ${escapeHTML(
                            video.title ||
                            "Untitled Video"
                        )}

                    </h3>


                    <p>

                        ${escapeHTML(
                            video.description ||
                            video.category ||
                            ""
                        )}

                    </p>

                </div>

            `;


            /*
            Clicking card opens player.
            */

            card.addEventListener(
                "click",
                function(){

                    openPlayer(
                        video
                    );

                }
            );


            videoGrid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   OPEN VIDEO PLAYER
===================================================== */

function openPlayer(
    video
){

    /*
    Make sure video URL exists.
    */

    if(
        !video.video_url
    ){

        alert(
            "This video does not have a video URL."
        );

        console.error(
            "Missing video_url:",
            video
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    const title =
        document.getElementById(
            "playerTitle"
        );


    const description =
        document.getElementById(
            "playerDescription"
        );


    /*
    Set video.
    */

    player.src =
        video.video_url;


    /*
    Set information.
    */

    title.textContent =
        video.title ||
        "Video";


    description.textContent =
        video.description ||
        "";


    /*
    Show player.
    */

    modal.style.display =
        "flex";


    /*
    Try autoplay.
    */

    player.play()
        .catch(
            function(){

                console.log(
                    "Autoplay blocked by browser."
                );

            }
        );

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();


    player.removeAttribute(
        "src"
    );


    player.load();


    modal.style.display =
        "none";

}


/* =====================================================
   CLICK OUTSIDE PLAYER
===================================================== */

document
    .getElementById(
        "playerModal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closePlayer();

            }

        }
    );


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closePlayer();

        }

    }
);


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(
    text
){

    return String(
        text
    )
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[
                character
            ];

        }
    );

}


/* =====================================================
   START WEBSITE
===================================================== */

loadVideos(
    "All"
);

</script>

</body>

</html>
