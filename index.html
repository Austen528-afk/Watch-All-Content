<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    background:#111;
    border-bottom:1px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#ff1744;
}

.admin-btn{
    background:#ff1744;
    color:white;

    text-decoration:none;

    padding:10px 15px;

    border-radius:8px;
}

.container{
    padding:25px;
    max-width:1400px;
    margin:auto;
}

.video-grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(260px,1fr));

    gap:20px;
}

.card{
    background:#151515;

    border:1px solid #222;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#ff1744;
}

.card img{
    width:100%;
    height:180px;

    object-fit:cover;

    background:#222;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#999;
    font-size:13px;
}

.player-modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:1000;

    padding:20px;
}

.player-box{
    width:100%;
    max-width:1000px;
}

.player-box video{
    width:100%;

    max-height:75vh;

    background:#000;

    border-radius:12px;
}

.close-btn{
    margin-bottom:10px;

    background:#ff1744;

    border:none;

    color:white;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;
}

.empty{
    text-align:center;

    color:#777;

    margin-top:50px;
}

.error{
    color:#ff1744;

    text-align:center;

    margin-top:30px;

    padding:20px;

    background:#1a1012;

    border:1px solid #442027;

    border-radius:10px;
}

</style>

</head>

<body>


<header>

    <div class="logo">
        Stream<span>X</span>
    </div>

    <a
        href="admin.html"
        class="admin-btn"
    >
        Admin
    </a>

</header>


<div class="container">

    <div
        id="videoGrid"
        class="video-grid"
    ></div>

    <div
        id="empty"
        class="empty"
    >
        Loading videos...
    </div>

</div>


<div
    class="player-modal"
    id="playerModal"
>

    <div class="player-box">

        <button
            class="close-btn"
            onclick="closePlayer()"
        >
            ✕ Close
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

    </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   LOAD VIDEOS
===================================== */

async function loadVideos(){

    const grid =
        document.getElementById(
            "videoGrid"
        );

    const empty =
        document.getElementById(
            "empty"
        );


    empty.style.display =
        "block";

    empty.innerHTML =
        "Loading videos...";


    console.log(
        "Connecting to Supabase..."
    );


    const {
        data,
        error
    } = await supabase

        .from("videos")

        .select(
            "id,title,description,category,video_url,thumbnail_url,views,created_at"
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    console.log(
        "Supabase data:",
        data
    );

    console.log(
        "Supabase error:",
        error
    );


    /* ERROR */

    if(error){

        grid.innerHTML = "";

        empty.innerHTML = `
            <div class="error">

                ❌ Could not load videos.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>
        `;

        console.error(
            "Supabase error:",
            error
        );

        return;
    }


    /* NO VIDEOS */

    if(!data || data.length === 0){

        grid.innerHTML = "";

        empty.style.display =
            "block";

        empty.innerHTML =
            "No videos uploaded yet.";

        return;
    }


    /* VIDEOS FOUND */

    empty.style.display =
        "none";

    grid.innerHTML = "";


    data.forEach(
        video => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const thumbnail =
                video.thumbnail_url ||
                "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


            card.innerHTML = `

                <img
                    src="${escapeHTML(thumbnail)}"
                    alt="${escapeHTML(video.title || "Video")}"
                >

                <div class="card-content">

                    <h3>
                        ${escapeHTML(
                            video.title ||
                            "Untitled Video"
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            video.category ||
                            "Uncategorized"
                        )}
                    </p>

                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    openPlayer(
                        video.video_url
                    );

                }
            );


            grid.appendChild(card);

        }
    );

}


/* =====================================
   VIDEO PLAYER
===================================== */

function openPlayer(url){

    if(!url){

        alert(
            "This video does not have a video URL."
        );

        return;
    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.src = url;

    modal.style.display =
        "flex";


    player.play().catch(
        function(error){

            console.log(
                "Autoplay blocked:",
                error
            );

        }
    );

}


/* =====================================
   CLOSE PLAYER
===================================== */

function closePlayer(){

    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.src = "";

    modal.style.display =
        "none";

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   START
===================================== */

loadVideos();

</script>

</body>

</html>
