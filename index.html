<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    background:#111;
    border-bottom:1px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#ff1744;
}

.admin-btn{
    background:#ff1744;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
}

.container{
    padding:25px;
}

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:#151515;
    border:1px solid #222;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#999;
    font-size:13px;
}

.player-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:1000;
}

.player-box{
    width:90%;
    max-width:1000px;
}

.player-box video{
    width:100%;
    border-radius:12px;
}

.close-btn{
    margin-bottom:10px;
    background:#ff1744;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#777;
    margin-top:50px;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        Stream<span>X</span>
    </div>

    <a href="admin.html" class="admin-btn">
        Admin
    </a>

</header>

<div class="container">

    <div id="videoGrid" class="video-grid"></div>

    <div id="empty" class="empty">
        Loading videos...
    </div>

</div>

<div class="player-modal" id="playerModal">

    <div class="player-box">

        <button
            class="close-btn"
            onclick="closePlayer()"
        >
            Close
        </button>

        <video
            id="videoPlayer"
            controls
            autoplay
        ></video>

    </div>

</div>

<script>

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function loadVideos(){

    const { data, error } =
    await supabase
    .from("videos")
    .select("*")
    .order("created_at",{ascending:false});

    const grid =
    document.getElementById("videoGrid");

    const empty =
    document.getElementById("empty");

    grid.innerHTML="";

    if(error){

        empty.innerHTML =
        "Failed to load videos";

        console.error(error);

        return;
    }

    if(!data || data.length===0){

        empty.innerHTML =
        "No videos uploaded yet.";

        return;
    }

    empty.style.display="none";

    data.forEach(video=>{

        const card =
        document.createElement("div");

        card.className="card";

        card.innerHTML=`

            <img
                src="${video.thumbnail_url}"
                alt="${video.title}"
            >

            <div class="card-content">

                <h3>${video.title}</h3>

                <p>${video.category || ""}</p>

            </div>

        `;

        card.onclick=()=>{

            openPlayer(video.video_url);

        };

        grid.appendChild(card);

    });

}

function openPlayer(url){

    document
    .getElementById("playerModal")
    .style.display="flex";

    document
    .getElementById("videoPlayer")
    .src=url;

}

function closePlayer(){

    document
    .getElementById("playerModal")
    .style.display="none";

    const player =
    document.getElementById("videoPlayer");

    player.pause();

    player.src="";

}

loadVideos();

</script>

</body>
</html>
