<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;

    background: rgba(8, 8, 8, 0.94);

    border-bottom: 1px solid #252525;

    backdrop-filter: blur(12px);
}

.logo {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: #ff1744;
}


/* =====================================================
   SEARCH
===================================================== */

.search-container {
    width: 420px;
    max-width: 45%;
}

.search-box {
    width: 100%;

    background: #151515;

    border: 1px solid #292929;

    border-radius: 25px;

    padding: 12px 18px;

    color: white;

    outline: none;

    font-size: 14px;
}

.search-box::placeholder {
    color: #666;
}

.search-box:focus {
    border-color: #ff1744;
}


/* =====================================================
   HEADER RIGHT
===================================================== */

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.online-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #21c477;

    box-shadow: 0 0 10px #21c477;
}

.online-text {
    color: #888;
    font-size: 12px;
}


/* =====================================================
   CATEGORY BAR
===================================================== */

.category-container {
    position: sticky;
    top: 70px;
    z-index: 900;

    background: #0b0b0b;

    border-bottom: 1px solid #202020;

    overflow-x: auto;

    scrollbar-width: none;
}

.category-container::-webkit-scrollbar {
    display: none;
}

.categories {
    display: flex;

    gap: 9px;

    padding: 15px 35px;

    min-width: max-content;
}

.category {
    background: #171717;

    border: 1px solid #292929;

    color: #999;

    padding: 9px 16px;

    border-radius: 20px;

    font-size: 12px;

    cursor: pointer;

    transition: .2s;

    white-space: nowrap;
}

.category:hover {
    color: white;
    border-color: #444;
}

.category.active {
    background: #ff1744;
    border-color: #ff1744;
    color: white;
}


/* =====================================================
   MAIN
===================================================== */

.main {
    max-width: 1600px;

    margin: auto;

    padding: 35px;
}


/* =====================================================
   HERO
===================================================== */

.hero {
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 34px;

    margin-bottom: 8px;
}

.hero p {
    color: #888;

    font-size: 14px;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.section-header h2 {
    font-size: 20px;
}

.video-count {
    color: #666;

    font-size: 12px;
}


/* =====================================================
   VIDEO GRID
===================================================== */

.video-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

    gap: 20px;
}


/* =====================================================
   VIDEO CARD
===================================================== */

.video-card {
    background: #111;

    border: 1px solid #252525;

    border-radius: 12px;

    overflow: hidden;

    cursor: pointer;

    transition:
        transform .2s,
        border-color .2s,
        background .2s;
}

.video-card:hover {
    transform: translateY(-4px);

    border-color: #444;

    background: #171717;
}


/* =====================================================
   THUMBNAIL
===================================================== */

.thumbnail {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #191919;

    overflow: hidden;
}

.thumbnail img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform .3s;
}

.video-card:hover .thumbnail img {
    transform: scale(1.04);
}

.thumbnail-placeholder {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 42px;

    color: #444;
}


/* =====================================================
   PLAY ICON
===================================================== */

.play-icon {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(0,0,0,.75);

    opacity: 0;

    transition: .2s;

    font-size: 18px;
}

.video-card:hover .play-icon {
    opacity: 1;
}


/* =====================================================
   CATEGORY TAG
===================================================== */

.category-tag {
    position: absolute;

    left: 10px;
    top: 10px;

    background: rgba(0,0,0,.82);

    border-radius: 5px;

    padding: 5px 8px;

    color: white;

    font-size: 10px;
}


/* =====================================================
   VIDEO INFO
===================================================== */

.video-info {
    padding: 14px;
}

.video-title {
    font-size: 14px;

    font-weight: bold;

    line-height: 1.4;

    margin-bottom: 7px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.video-description {
    color: #777;

    font-size: 11px;

    line-height: 1.5;

    height: 32px;

    overflow: hidden;
}

.video-meta {
    display: flex;

    justify-content: space-between;

    margin-top: 12px;

    color: #555;

    font-size: 10px;
}


/* =====================================================
   LOADING
===================================================== */

.loading {
    min-height: 300px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #666;

    gap: 15px;
}

.spinner {
    width: 35px;
    height: 35px;

    border: 3px solid #292929;

    border-top-color: #ff1744;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    display: none;

    text-align: center;

    padding: 80px 20px;

    color: #666;
}

.empty-icon {
    font-size: 50px;

    margin-bottom: 15px;
}

.empty h3 {
    color: #999;

    font-size: 18px;

    margin-bottom: 7px;
}

.empty p {
    font-size: 12px;
}


/* =====================================================
   ERROR
===================================================== */

.error-message {
    display: none;

    background: #281015;

    border: 1px solid #70283a;

    color: #ff6b88;

    padding: 15px;

    border-radius: 8px;

    margin-bottom: 25px;

    font-size: 13px;
}


/* =====================================================
   VIDEO MODAL
===================================================== */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background: rgba(0,0,0,.94);

    padding: 30px;

    overflow-y: auto;
}

.modal.show {
    display: flex;

    align-items: center;

    justify-content: center;
}

.modal-content {
    width: 100%;

    max-width: 1000px;

    background: #101010;

    border: 1px solid #292929;

    border-radius: 14px;

    overflow: hidden;

    position: relative;
}

.close-modal {
    position: absolute;

    right: 15px;
    top: 15px;

    z-index: 10;

    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,.8);

    color: white;

    font-size: 24px;

    cursor: pointer;
}

.close-modal:hover {
    background: #ff1744;
}

.player-container {
    width: 100%;

    background: black;
}

.player-container video {
    display: block;

    width: 100%;

    max-height: 70vh;

    background: black;
}

.modal-info {
    padding: 22px;
}

.modal-title {
    font-size: 22px;

    margin-bottom: 10px;
}

.modal-category {
    display: inline-block;

    background: #ff1744;

    padding: 5px 9px;

    border-radius: 5px;

    font-size: 10px;

    margin-bottom: 13px;
}

.modal-description {
    color: #999;

    font-size: 13px;

    line-height: 1.7;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    margin-top: 70px;

    padding: 30px 0;

    border-top: 1px solid #202020;

    color: #555;

    font-size: 11px;

    text-align: center;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:850px) {

    .header {
        height: auto;

        min-height: 65px;

        padding: 12px 15px;

        gap: 12px;

        flex-wrap: wrap;
    }

    .logo {
        font-size: 22px;
    }

    .search-container {
        order: 3;

        width: 100%;

        max-width: none;

        padding-bottom: 4px;
    }

    .header-right {
        margin-left: auto;
    }

    .category-container {
        top: 65px;
    }

    .categories {
        padding: 12px 15px;
    }

    .main {
        padding: 25px 15px 40px;
    }

    .hero h1 {
        font-size: 27px;
    }

    .video-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap: 12px;
    }

    .video-info {
        padding: 11px;
    }

    .video-title {
        font-size: 12px;
    }

    .video-description {
        font-size: 10px;
    }

    .online-text {
        display: none;
    }

    .modal {
        padding: 10px;
    }

}


@media(max-width:500px) {

    .video-grid {
        grid-template-columns: 1fr;
    }

    .thumbnail {
        aspect-ratio: 16 / 9;
    }

    .modal-title {
        font-size: 18px;
    }

}


/* =====================================================
   NO JAVASCRIPT MESSAGE
===================================================== */

.no-js {
    padding: 30px;

    text-align: center;

    color: #ff6b88;
}

</style>

</head>


<body>


<noscript>

    <div class="no-js">
        JavaScript is required to use StreamX.
    </div>

</noscript>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">
        Stream<span>X</span>
    </div>


    <div class="search-container">

        <input
            type="search"
            id="searchInput"
            class="search-box"
            placeholder="Search videos..."
            autocomplete="off"
        >

    </div>


    <div class="header-right">

        <div class="online-dot"></div>

        <span class="online-text">
            Online
        </span>

    </div>

</header>


<!-- =====================================================
     CATEGORIES
===================================================== -->

<nav class="category-container">

    <div
        class="categories"
        id="categories"
    >

        <!-- Categories generated by JavaScript -->

    </div>

</nav>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <section class="hero">

        <h1>
            Discover Videos
        </h1>

        <p>
            Browse and stream the latest content.
        </p>

    </section>


    <div
        id="errorMessage"
        class="error-message"
    ></div>


    <section>

        <div class="section-header">

            <h2 id="sectionTitle">
                All Videos
            </h2>

            <span
                id="videoCount"
                class="video-count"
            >
                Loading...
            </span>

        </div>


        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <span>
                Loading videos...
            </span>

        </div>


        <!-- VIDEO GRID -->

        <div
            id="videoGrid"
            class="video-grid"
        ></div>


        <!-- EMPTY -->

        <div
            id="emptyState"
            class="empty"
        >

            <div class="empty-icon">
                🎬
            </div>

            <h3>
                No videos found
            </h3>

            <p>
                Try another category or search term.
            </p>

        </div>

    </section>


    <footer class="footer">

        StreamX © 2026

    </footer>

</main>


<!-- =====================================================
     VIDEO MODAL
===================================================== -->

<div
    id="videoModal"
    class="modal"
>

    <div class="modal-content">

        <button
            class="close-modal"
            onclick="closeVideo()"
            aria-label="Close"
        >
            ×
        </button>


        <div class="player-container">

            <video
                id="videoPlayer"
                controls
                playsinline
            ></video>

        </div>


        <div class="modal-info">

            <div
                id="modalCategory"
                class="modal-category"
            >
                Category
            </div>


            <h2
                id="modalTitle"
                class="modal-title"
            >
                Video
            </h2>


            <p
                id="modalDescription"
                class="modal-description"
            ></p>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CATEGORIES
===================================================== */

const categories = [
    "All",
    "Sports",
    "Music",
    "Comedy",
    "Movies",
    "Education",
    "Lifestyle"
];


/* =====================================================
   STATE
===================================================== */

let allVideos = [];

let selectedCategory = "All";

let searchTerm = "";


/* =====================================================
   ELEMENTS
===================================================== */

const videoGrid =
    document.getElementById("videoGrid");

const loading =
    document.getElementById("loading");

const emptyState =
    document.getElementById("emptyState");

const videoCount =
    document.getElementById("videoCount");

const sectionTitle =
    document.getElementById("sectionTitle");

const errorMessage =
    document.getElementById("errorMessage");

const categoriesContainer =
    document.getElementById("categories");

const searchInput =
    document.getElementById("searchInput");


/* =====================================================
   CREATE CATEGORY OPTIONS
===================================================== */

function createCategories() {

    categoriesContainer.innerHTML = "";

    categories.forEach(category => {

        const option =
            document.createElement("button");

        option.type = "button";

        option.className =
            "category";

        if(category === "All") {

            option.classList.add("active");

        }

        option.textContent =
            category;

        option.addEventListener(
            "click",
            () => {

                selectCategory(category);

            }
        );

        categoriesContainer.appendChild(option);

    });

}


/* =====================================================
   SELECT CATEGORY
===================================================== */

function selectCategory(category) {

    selectedCategory = category;

    document
        .querySelectorAll(".category")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.textContent === category
            );

        });


    sectionTitle.textContent =
        category === "All"
            ? "All Videos"
            : category;


    renderVideos();

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        searchTerm =
            this.value
                .trim()
                .toLowerCase();

        renderVideos();

    }
);


/* =====================================================
   GET PUBLIC URL
===================================================== */

function getPublicURL(
    value,
    bucket
) {

    if(!value) {

        return null;

    }


    /*
       If the database already contains
       a complete URL, use it.
    */

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        return value;

    }


    /*
       Otherwise treat it as a
       Supabase storage path.
    */

    return supabaseClient
        .storage
        .from(bucket)
        .getPublicUrl(value)
        .data
        .publicUrl;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   LOAD VIDEOS FROM SUPABASE
===================================================== */

async function loadVideos() {

    loading.style.display =
        "flex";

    videoGrid.innerHTML =
        "";

    emptyState.style.display =
        "none";

    errorMessage.style.display =
        "none";


    try {

        const result =
            await supabaseClient
                .from("videos")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if(result.error) {

            throw result.error;

        }


        allVideos =
            result.data || [];


        loading.style.display =
            "none";


        renderVideos();


    } catch(error) {

        console.error(
            "Supabase error:",
            error
        );


        loading.style.display =
            "none";


        errorMessage.textContent =
            "Unable to load videos: " +
            error.message;


        errorMessage.style.display =
            "block";


        videoCount.textContent =
            "Error";

    }

}


/* =====================================================
   FILTER VIDEOS
===================================================== */

function getFilteredVideos() {

    return allVideos.filter(video => {

        const categoryMatch =
            selectedCategory === "All" ||
            String(video.category || "")
                .toLowerCase() ===
            selectedCategory.toLowerCase();


        if(!categoryMatch) {

            return false;

        }


        if(!searchTerm) {

            return true;

        }


        const title =
            String(
                video.title || ""
            ).toLowerCase();


        const description =
            String(
                video.description || ""
            ).toLowerCase();


        const category =
            String(
                video.category || ""
            ).toLowerCase();


        return (
            title.includes(searchTerm) ||
            description.includes(searchTerm) ||
            category.includes(searchTerm)
        );

    });

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos() {

    const videos =
        getFilteredVideos();


    videoGrid.innerHTML =
        "";


    videoCount.textContent =
        videos.length +
        (
            videos.length === 1
                ? " video"
                : " videos"
        );


    if(videos.length === 0) {

        emptyState.style.display =
            "block";

        return;

    }


    emptyState.style.display =
        "none";


    videos.forEach(video => {

        createVideoCard(video);

    });

}


/* =====================================================
   CREATE VIDEO CARD
===================================================== */

function createVideoCard(video) {

    const card =
        document.createElement("article");

    card.className =
        "video-card";


    const thumbnailURL =
        getPublicURL(
            video.thumbnail_url,
            "thumbnails"
        );


    const title =
        video.title ||
        "Untitled Video";


    const description =
        video.description ||
        "No description available.";


    const category =
        video.category ||
        "General";


    const views =
        Number(video.views || 0);


    const date =
        video.created_at
            ? new Date(
                video.created_at
              ).toLocaleDateString()
            : "";


    card.innerHTML = `

        <div class="thumbnail">

            ${
                thumbnailURL

                ?

                `
                <img
                    src="${escapeHTML(thumbnailURL)}"
                    alt="${escapeHTML(title)}"
                    loading="lazy"
                    onerror="this.style.display='none'"
                >
                `

                :

                `
                <div class="thumbnail-placeholder">
                    🎬
                </div>
                `
            }


            <div class="category-tag">
                ${escapeHTML(category)}
            </div>


            <div class="play-icon">
                ▶
            </div>

        </div>


        <div class="video-info">

            <div class="video-title">
                ${escapeHTML(title)}
            </div>


            <div class="video-description">
                ${escapeHTML(description)}
            </div>


            <div class="video-meta">

                <span>
                    ${views.toLocaleString()} views
                </span>

                <span>
                    ${escapeHTML(date)}
                </span>

            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            openVideo(video);

        }
    );


    videoGrid.appendChild(card);

}


/* =====================================================
   OPEN VIDEO
===================================================== */

function openVideo(video) {

    const videoURL =
        getPublicURL(
            video.video_url,
            "videos"
        );


    if(!videoURL) {

        alert(
            "The video file could not be found."
        );

        return;

    }


    const player =
        document.getElementById(
            "videoPlayer"
        );


    const modal =
        document.getElementById(
            "videoModal"
        );


    document.getElementById(
        "modalTitle"
    ).textContent =
        video.title ||
        "Untitled Video";


    document.getElementById(
        "modalDescription"
    ).textContent =
        video.description ||
        "";


    document.getElementById(
        "modalCategory"
    ).textContent =
        video.category ||
        "General";


    player.src =
        videoURL;


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    /*
       Attempt to start playback.
       The browser may block autoplay,
       in which case the controls remain
       available.
    */

    player.play().catch(() => {});


    /*
       Update views.
       This is intentionally done without
       allowing a failed view update to
       break video playback.
    */

    updateViews(
        video.id,
        Number(video.views || 0)
    );

}


/* =====================================================
   UPDATE VIEWS
===================================================== */

async function updateViews(
    videoID,
    currentViews
) {

    try {

        const newViews =
            currentViews + 1;


        await supabaseClient
            .from("videos")
            .update({
                views: newViews
            })
            .eq(
                "id",
                videoID
            );


        /*
           Update local copy too.
        */

        const localVideo =
            allVideos.find(
                video =>
                    String(video.id) ===
                    String(videoID)
            );


        if(localVideo) {

            localVideo.views =
                newViews;

        }

    } catch(error) {

        console.warn(
            "Could not update views:",
            error
        );

    }

}


/* =====================================================
   CLOSE VIDEO
===================================================== */

function closeVideo() {

    const modal =
        document.getElementById(
            "videoModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.removeAttribute(
        "src"
    );

    player.load();


    modal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

}


/* =====================================================
   CLOSE WHEN CLICKING OUTSIDE
===================================================== */

document
    .getElementById("videoModal")
    .addEventListener(
        "click",
        function(event) {

            if(
                event.target ===
                this
            ) {

                closeVideo();

            }

        }
    );


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if(
            event.key === "Escape"
        ) {

            closeVideo();

        }

    }
);


/* =====================================================
   START APPLICATION
===================================================== */

createCategories();

loadVideos();

</script>

</body>
</html>
