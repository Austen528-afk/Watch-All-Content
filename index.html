<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;

    height:70px;
    padding:0 25px;

    background:#111;
    border-bottom:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.logo span{
    color:#ff1744;
}

.admin-btn{
    background:#ff1744;
    color:#fff;

    text-decoration:none;

    padding:10px 16px;

    border-radius:8px;

    font-size:13px;
    font-weight:bold;
}

.admin-btn:hover{
    background:#e90035;
}

/* CATEGORY AREA */

.category-section{
    background:#0d0d0d;

    padding:22px 25px;

    border-bottom:1px solid #222;
}

.category-title{
    color:#888;

    font-size:13px;

    margin-bottom:13px;
}

.categories{
    display:flex;
    gap:10px;

    overflow-x:auto;

    scrollbar-width:none;

    padding-bottom:3px;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{

    flex-shrink:0;

    background:#171717;

    color:#aaa;

    border:1px solid #333;

    padding:10px 16px;

    border-radius:20px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}

.category-btn:hover{
    color:#fff;
    border-color:#ff1744;
}

.category-btn.active{
    background:#ff1744;
    color:#fff;
    border-color:#ff1744;
}

/* MAIN */

.container{
    padding:25px;
    max-width:1600px;
    margin:auto;
}

.page-heading{
    margin-bottom:20px;
}

.page-heading h1{
    font-size:22px;
}

.current-category{
    color:#ff1744;
}

/* VIDEO GRID */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

    gap:20px;
}

/* CARD */

.card{

    background:#151515;

    border:1px solid #252525;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}

.card:hover{

    transform:translateY(-3px);

    border-color:#444;
}

/* THUMBNAIL */

.thumbnail{

    width:100%;
    height:180px;

    background:#222;

    position:relative;

    overflow:hidden;
}

.thumbnail img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.category-label{

    position:absolute;

    top:10px;
    left:10px;

    background:rgba(0,0,0,.8);

    color:white;

    padding:5px 8px;

    border-radius:5px;

    font-size:10px;
}

.play-overlay{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.25);

    opacity:0;

    transition:.2s;
}

.card:hover .play-overlay{
    opacity:1;
}

.play-circle{

    width:52px;
    height:52px;

    border-radius:50%;

    background:#ff1744;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:20px;
}

/* CARD CONTENT */

.card-content{
    padding:15px;
}

.card-content h3{

    font-size:15px;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.card-content p{

    color:#999;

    font-size:12px;

    line-height:1.5;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

/* MESSAGE */

.message{

    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#777;
}

.message-icon{

    font-size:45px;

    margin-bottom:15px;
}

/* PLAYER */

.player-modal{

    position:fixed;

    inset:0;

    z-index:1000;

    background:rgba(0,0,0,.95);

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;
}

.player-box{

    width:100%;

    max-width:1000px;
}

.player-box video{

    width:100%;

    max-height:75vh;

    background:#000;

    border-radius:12px;

    display:block;
}

.close-btn{

    background:#ff1744;

    border:none;

    color:white;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;

    margin-bottom:10px;
}

.player-info{

    padding-top:15px;
}

.player-info h2{

    font-size:20px;

    margin-bottom:7px;
}

.player-info p{

    color:#999;

    font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:23px;
    }

    .admin-btn{
        padding:8px 11px;
    }

    .category-section{
        padding:15px;
    }

    .container{
        padding:15px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

    .thumbnail{
        height:210px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

```
<div class="logo">
    Stream<span>X</span>
</div>

<a
    href="admin.html"
    class="admin-btn"
>
    Admin
</a>
```

</header>

<!-- CATEGORY NAVIGATION -->

<section class="category-section">

```
<div class="category-title">
    Browse by category
</div>

<div class="categories">

    <button
        class="category-btn active"
        onclick="selectCategory('All',this)"
    >
        🎬 All Videos
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Trending',this)"
    >
        🔥 Trending
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Entertainment',this)"
    >
        🎭 Entertainment
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Music',this)"
    >
        🎵 Music
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Sports',this)"
    >
        ⚽ Sports
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Gaming',this)"
    >
        🎮 Gaming
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Education',this)"
    >
        🎓 Education
    </button>

    <button
        class="category-btn"
        onclick="selectCategory('Lifestyle',this)"
    >
        ✨ Lifestyle
    </button>

</div>
```

</section>

<!-- MAIN -->

<main class="container">

```
<div class="page-heading">

    <h1>
        <span
            id="currentCategory"
            class="current-category"
        >
            All Videos
        </span>
    </h1>

</div>


<div
    id="videoGrid"
    class="video-grid"
>

    <div class="message">

        <div class="message-icon">
            ⏳
        </div>

        Connecting to StreamX...

    </div>

</div>
```

</main>

<!-- PLAYER -->

<div
    class="player-modal"
    id="playerModal"
>

```
<div class="player-box">

    <button
        class="close-btn"
        onclick="closePlayer()"
    >
        ✕ Close
    </button>

    <video
        id="videoPlayer"
        controls
        playsinline
    ></video>

    <div class="player-info">

        <h2 id="playerTitle">
            Video
        </h2>

        <p id="playerDescription"></p>

    </div>

</div>
```

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const videoGrid =
document.getElementById("videoGrid");

const currentCategory =
document.getElementById("currentCategory");


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(category="All"){

    videoGrid.innerHTML = `

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            Loading ${escapeHTML(category)}
            videos...

        </div>

    `;


    try{

        let query =
            supabase
            .from("videos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        /*
        If a category was selected,
        ask Supabase ONLY for that category.
        */

        if(category !== "All"){

            query =
                query.eq(
                    "category",
                    category
                );

        }


        const {
            data,
            error
        } = await query;


        console.log(
            "Supabase videos:",
            data
        );


        if(error){

            console.error(
                "Supabase error:",
                error
            );

            videoGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>

                    <h3>
                        Unable to load videos
                    </h3>

                    <p style="margin-top:10px;">
                        ${escapeHTML(error.message)}
                    </p>

                </div>

            `;

            return;
        }


        if(!data || data.length === 0){

            videoGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        🎬
                    </div>

                    <h3>
                        No videos found
                    </h3>

                    <p style="margin-top:10px;">
                        There are currently no videos
                        in ${escapeHTML(category)}.
                    </p>

                </div>

            `;

            return;
        }


        displayVideos(data);

    }

    catch(error){

        console.error(
            "Connection error:",
            error
        );

        videoGrid.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ⚠️
                </div>

                <h3>
                    Connection error
                </h3>

                <p style="margin-top:10px;">
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   CATEGORY SELECTION
===================================================== */

function selectCategory(
    category,
    button
){

    /*
    Change active button.
    */

    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    /*
    Change heading.
    */

    currentCategory.textContent =
        category === "All"
            ? "All Videos"
            : category;


    /*
    IMPORTANT:
    Query Supabase again.
    */

    loadVideos(category);

}


/* =====================================================
   DISPLAY VIDEOS
===================================================== */

function displayVideos(videos){

    videoGrid.innerHTML = "";


    videos.forEach(
        video => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const thumbnail =
                video.thumbnail_url ||
                "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


            card.innerHTML = `

                <div class="thumbnail">

                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="${escapeHTML(
                            video.title ||
                            "Video"
                        )}"
                        loading="lazy"
                    >

                    <div class="category-label">

                        ${escapeHTML(
                            video.category ||
                            "Uncategorized"
                        )}

                    </div>

                    <div class="play-overlay">

                        <div class="play-circle">
                            ▶
                        </div>

                    </div>

                </div>


                <div class="card-content">

                    <h3>
                        ${escapeHTML(
                            video.title ||
                            "Untitled Video"
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            video.description ||
                            ""
                        )}
                    </p>

                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    openPlayer(video);

                }
            );


            videoGrid.appendChild(card);

        }
    );

}


/* =====================================================
   VIDEO PLAYER
===================================================== */

function openPlayer(video){

    if(!video.video_url){

        alert(
            "Video URL is missing."
        );

        console.error(
            "Missing video_url:",
            video
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );

    const player =
        document.getElementById(
            "videoPlayer"
        );


    document.getElementById(
        "playerTitle"
    ).textContent =
        video.title ||
        "Video";


    document.getElementById(
        "playerDescription"
    ).textContent =
        video.description ||
        "";


    player.src =
        video.video_url;


    modal.style.display =
        "flex";


    player.play()
        .catch(
            function(){

                /*
                Browser may block autoplay.
                Controls are still available.
                */

            }
        );

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

    const modal =
        document.getElementById(
            "playerModal"
        );

    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.removeAttribute(
        "src"
    );

    player.load();


    modal.style.display =
        "none";

}


/* =====================================================
   CLOSE MODAL BY CLICKING OUTSIDE
===================================================== */

document
.getElementById("playerModal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closePlayer();

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closePlayer();

        }

    }
);


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /[&<>"']/g,
            function(character){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[character];

            }
        );

}


/* =====================================================
   START
===================================================== */

loadVideos("All");

</script>

</body>
</html>
