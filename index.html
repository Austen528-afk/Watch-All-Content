<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,8,8,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #222;
}

.header-inner{
    max-width:1400px;
    margin:auto;
    padding:16px 25px;
    display:flex;
    align-items:center;
    gap:30px;
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
    white-space:nowrap;
}

.logo span{
    color:#ff1744;
}

/* =========================
   SEARCH
========================= */

.search-wrapper{
    flex:1;
    max-width:600px;
    position:relative;
    margin:auto;
}

.search{
    width:100%;
    height:46px;
    background:#151515;
    border:1px solid #303030;
    border-radius:25px;
    color:white;
    padding:0 45px;
    outline:none;
    font-size:14px;
}

.search::placeholder{
    color:#666;
}

.search:focus{
    border-color:#ff1744;
    box-shadow:0 0 0 3px rgba(255,23,68,.08);
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
    font-size:17px;
}

.clear-search{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    width:25px;
    height:25px;
    border:none;
    border-radius:50%;
    background:#292929;
    color:#aaa;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:15px;
}

.clear-search:hover{
    background:#ff1744;
    color:white;
}

/* =========================
   ONLINE
========================= */

.header-right{
    white-space:nowrap;
}

.online{
    display:flex;
    align-items:center;
    gap:7px;
    color:#888;
    font-size:12px;
}

.online-dot{
    width:7px;
    height:7px;
    background:#21c477;
    border-radius:50%;
    box-shadow:0 0 10px #21c477;
}

/* =========================
   CATEGORY BAR
========================= */

.category-bar{
    width:100%;
    border-bottom:1px solid #1c1c1c;
    background:#0c0c0c;
    overflow-x:auto;
    scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
    display:none;
}

.categories{
    max-width:1400px;
    margin:auto;
    padding:12px 25px;
    display:flex;
    gap:9px;
    white-space:nowrap;
}

.category{
    border:none;
    background:#181818;
    color:#999;
    padding:9px 16px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
    transition:.2s;
}

.category:hover{
    background:#292929;
    color:white;
}

.category.active{
    background:#ff1744;
    color:white;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1400px;
    margin:auto;
    padding:30px 25px 70px;
}

/* =========================
   HERO
========================= */

.hero{
    margin-bottom:32px;
    padding:35px;
    border-radius:16px;
    background:linear-gradient(135deg,#171717,#0d0d0d);
    border:1px solid #262626;
    position:relative;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    right:-100px;
    top:-100px;
    background:#ff1744;
    opacity:.08;
    border-radius:50%;
    filter:blur(30px);
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
    position:relative;
    z-index:1;
}

.hero h1 span{
    color:#ff1744;
}

.hero p{
    color:#888;
    font-size:14px;
    line-height:1.6;
    position:relative;
    z-index:1;
}

/* =========================
   SECTION HEADER
========================= */

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-header h2{
    font-size:21px;
}

.result-count{
    color:#666;
    font-size:12px;
}

.search-status{
    display:none;
    margin-top:-8px;
    margin-bottom:18px;
    color:#777;
    font-size:12px;
}

.search-status strong{
    color:#ff1744;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

/* =========================
   VIDEO CARD
========================= */

.video-card{
    background:#111;
    border:1px solid #252525;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:
        transform .2s,
        border-color .2s,
        background .2s;
}

.video-card:hover{
    transform:translateY(-4px);
    border-color:#3a3a3a;
    background:#171717;
}

/* =========================
   THUMBNAIL
========================= */

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#1d1d1d;
    position:relative;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s;
    user-select:none;
    -webkit-user-select:none;
}

.video-card:hover .thumbnail img{
    transform:scale(1.04);
}

.no-thumbnail{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    color:#444;
}

/* =========================
   PLAY OVERLAY
========================= */

.play-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.2);
    opacity:0;
    transition:.2s;
}

.video-card:hover .play-overlay{
    opacity:1;
}

.play-circle{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    padding-left:3px;
    box-shadow:0 5px 25px rgba(0,0,0,.5);
}

/* =========================
   CATEGORY TAG
========================= */

.category-tag{
    position:absolute;
    left:9px;
    top:9px;
    background:rgba(0,0,0,.78);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    padding:5px 8px;
    border-radius:5px;
    font-size:10px;
    backdrop-filter:blur(5px);
}

/* =========================
   VIDEO INFO
========================= */

.video-info{
    padding:14px;
}

.video-title{
    font-size:14px;
    font-weight:bold;
    line-height:1.4;
    margin-bottom:7px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.video-description{
    color:#777;
    font-size:11px;
    line-height:1.5;
    margin-bottom:9px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.video-meta{
    display:flex;
    justify-content:space-between;
    color:#555;
    font-size:10px;
}

/* =========================
   LOADING
========================= */

.loading{
    grid-column:1/-1;
    min-height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:#666;
    gap:15px;
}

.spinner{
    width:35px;
    height:35px;
    border:3px solid #292929;
    border-top-color:#ff1744;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#666;
}

.empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

.empty h3{
    color:#aaa;
    font-size:18px;
    margin-bottom:8px;
}

.empty p{
    font-size:12px;
}

/* =========================
   PLAYER MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.player-container{
    width:min(1100px,100%);
    max-height:95vh;
    background:#101010;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
    position:relative;
}

.player-header{
    padding:15px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #242424;
}

.player-title{
    font-size:15px;
    font-weight:bold;
    padding-right:30px;
}

.close-button{
    width:34px;
    height:34px;
    border:none;
    border-radius:50%;
    background:#222;
    color:white;
    cursor:pointer;
    font-size:20px;
    flex-shrink:0;
}

.close-button:hover{
    background:#ff1744;
}

.player-video{
    width:100%;
    max-height:70vh;
    display:block;
    background:#000;
    user-select:none;
    -webkit-user-select:none;
}

.player-info{
    padding:18px;
}

.player-category{
    display:inline-block;
    color:#ff1744;
    font-size:11px;
    margin-bottom:8px;
}

.player-description{
    color:#999;
    font-size:12px;
    line-height:1.6;
}

/* =========================
   FOOTER
========================= */

.footer{
    border-top:1px solid #1d1d1d;
    padding:25px;
    text-align:center;
    color:#555;
    font-size:11px;
}

/* =========================
   CATEGORY SUGGESTIONS
========================= */

.category-suggestions{
    position:absolute;
    top:52px;
    left:0;
    right:0;
    background:#151515;
    border:1px solid #303030;
    border-radius:10px;
    overflow:hidden;
    display:none;
    z-index:2000;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.category-suggestion{
    padding:12px 15px;
    color:#aaa;
    font-size:12px;
    cursor:pointer;
    border-bottom:1px solid #222;
}

.category-suggestion:last-child{
    border-bottom:none;
}

.category-suggestion:hover{
    background:#222;
    color:white;
}

.category-suggestion span{
    color:#ff1744;
    margin-right:6px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .header-inner{
        padding:13px 15px;
        gap:15px;
        flex-wrap:wrap;
    }

    .logo{
        font-size:23px;
    }

    .header-right{
        display:none;
    }

    .search-wrapper{
        order:3;
        flex-basis:100%;
        max-width:none;
    }

    .categories{
        padding:10px 15px;
    }

    .main{
        padding:20px 15px 50px;
    }

    .hero{
        padding:25px 20px;
    }

    .hero h1{
        font-size:27px;
    }

    .video-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .video-info{
        padding:11px;
    }

    .video-title{
        font-size:12px;
    }

    .video-description{
        display:none;
    }

    .video-meta{
        font-size:9px;
    }
}

@media(max-width:480px){

    .video-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .hero{
        margin-bottom:22px;
    }

    .hero p{
        font-size:12px;
    }

    .section-header h2{
        font-size:18px;
    }
}

</style>

</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABLES
========================= */

let allVideos = [];

let currentCategory = "All";

let searchTerm = "";


/*
 * Keeps track of the video whose
 * current playback session is being
 * counted.
 *
 * This prevents the same opening
 * from being counted multiple times.
 */

let currentViewVideoId = null;

let viewCountedForCurrentVideo = false;


/* =========================
   ELEMENTS
========================= */

const videoGrid =
    document.getElementById("videoGrid");

const resultCount =
    document.getElementById("resultCount");

const searchInput =
    document.getElementById("searchInput");

const clearSearch =
    document.getElementById("clearSearch");

const sectionTitle =
    document.getElementById("sectionTitle");

const searchStatus =
    document.getElementById("searchStatus");

const categorySuggestions =
    document.getElementById("categorySuggestions");

const videoModal =
    document.getElementById("videoModal");

const playerVideo =
    document.getElementById("playerVideo");

const playerTitle =
    document.getElementById("playerTitle");

const playerCategory =
    document.getElementById("playerCategory");

const playerDescription =
    document.getElementById("playerDescription");

const closePlayer =
    document.getElementById("closePlayer");


/* =========================
   CATEGORIES
========================= */

const categories = [

    "All",
    "BackShots",
    "Masterbates",
    "RoughX",
    "BBW",
    "Africans",
    "Cums",
    "Close Friends"

];


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

    showLoading();

    try{

        const result =
            await supabaseClient
                .from("videos")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(result.error){

            console.error(
                "Supabase error:",
                result.error
            );

            showError(
                "Unable to load videos. Please try again."
            );

            return;

        }


        allVideos =
            result.data || [];


        renderVideos();

    }
    catch(error){

        console.error(
            "Unexpected load error:",
            error
        );

        showError(
            "Unable to load videos. Please try again."
        );

    }

}


/* =========================
   FILTER
========================= */

function getFilteredVideos(){

    return allVideos.filter(video => {

        const videoCategory =
            String(
                video.category || ""
            );


        const categoryMatch =
            currentCategory === "All" ||
            videoCategory.toLowerCase() ===
            currentCategory.toLowerCase();


        const title =
            String(
                video.title || ""
            ).toLowerCase();


        const description =
            String(
                video.description || ""
            ).toLowerCase();


        const category =
            videoCategory.toLowerCase();


        const searchMatch =
            !searchTerm ||
            title.includes(searchTerm) ||
            description.includes(searchTerm) ||
            category.includes(searchTerm);


        return (
            categoryMatch &&
            searchMatch
        );

    });

}


/* =========================
   RENDER
========================= */

function renderVideos(){

    const videos =
        getFilteredVideos();


    videoGrid.innerHTML =
        "";


    if(searchTerm){

        sectionTitle.textContent =
            "Search Results";


        searchStatus.style.display =
            "block";


        searchStatus.innerHTML =
            "Searching for: <strong>" +
            escapeHTML(searchInput.value) +
            "</strong>";

    }
    else{

        searchStatus.style.display =
            "none";


        sectionTitle.textContent =
            currentCategory === "All"
            ? "All Videos"
            : currentCategory;

    }


    resultCount.textContent =
        videos.length +
        (
            videos.length === 1
            ? " video"
            : " videos"
        );


    if(videos.length === 0){

        showEmpty();

        return;

    }


    videos.forEach(video => {

        videoGrid.appendChild(
            createVideoCard(video)
        );

    });

}


/* =========================
   CREATE CARD
========================= */

function createVideoCard(video){

    const card =
        document.createElement("article");


    card.className =
        "video-card";


    const thumbnail =
        getPublicURL(
            video.thumbnail_url,
            "thumbnails"
        );


    const title =
        video.title ||
        "Untitled Video";


    const description =
        video.description ||
        "";


    const category =
        video.category ||
        "General";


    const views =
        Number(
            video.views || 0
        ).toLocaleString();


    let date = "";


    if(video.created_at){

        date =
            new Date(
                video.created_at
            ).toLocaleDateString();

    }


    card.innerHTML = `

        <div class="thumbnail">

            ${
                thumbnail
                ?

                `
                <img
                    src="${escapeHTML(thumbnail)}"
                    alt="${escapeHTML(title)}"
                    loading="lazy"
                    draggable="false"
                >
                `

                :

                `
                <div class="no-thumbnail">
                    🎬
                </div>
                `
            }


            <div class="play-overlay">

                <div class="play-circle">
                    ▶
                </div>

            </div>


            <div class="category-tag">
                ${escapeHTML(category)}
            </div>

        </div>


        <div class="video-info">

            <div class="video-title">
                ${escapeHTML(title)}
            </div>


            ${
                description
                ?

                `
                <div class="video-description">
                    ${escapeHTML(description)}
                </div>
                `

                :

                ""
            }


            <div class="video-meta">

                <span
                    class="view-count-${escapeHTML(String(video.id))}"
                >
                    ${views} views
                </span>


                <span>
                    ${escapeHTML(date)}
                </span>

            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        function(){

            openPlayer(video);

        }
    );


    return card;

}


/* =========================
   PUBLIC URL
========================= */

function getPublicURL(
    value,
    bucket
){

    if(!value){

        return null;

    }


    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        return value;

    }


    return supabaseClient
        .storage
        .from(bucket)
        .getPublicUrl(value)
        .data
        .publicUrl;

}


/* =========================
   STORAGE PATH
========================= */

function getStoragePath(
    value,
    bucket
){

    if(!value){

        return null;

    }


    if(
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ){

        return value;

    }


    try{

        const url =
            new URL(value);


        const publicMarker =
            `/storage/v1/object/public/${bucket}/`;


        const publicIndex =
            url.pathname.indexOf(
                publicMarker
            );


        if(publicIndex !== -1){

            return decodeURIComponent(

                url.pathname.substring(

                    publicIndex +
                    publicMarker.length

                )

            );

        }


        const signedMarker =
            `/storage/v1/object/sign/${bucket}/`;


        const signedIndex =
            url.pathname.indexOf(
                signedMarker
            );


        if(signedIndex !== -1){

            return decodeURIComponent(

                url.pathname.substring(

                    signedIndex +
                    signedMarker.length

                )

            );

        }


        return null;

    }
    catch(error){

        console.error(
            "Storage path error:",
            error
        );

        return null;

    }

}


/* =========================
   GET VIDEO URL
========================= */

async function getVideoURL(video){

    const rawValue =
        video.video_url;


    if(!rawValue){

        return null;

    }


    const storagePath =
        getStoragePath(
            rawValue,
            "videos"
        );


    if(!storagePath){

        console.error(
            "Invalid video path:",
            rawValue
        );

        return null;

    }


    try{

        const result =
            await supabaseClient
                .storage
                .from("videos")
                .createSignedUrl(
                    storagePath,
                    3600
                );


        if(result.error){

            console.error(
                "Signed URL error:",
                result.error
            );

            return null;

        }


        return result.data.signedUrl;

    }
    catch(error){

        console.error(
            "Video URL error:",
            error
        );

        return null;

    }

}


/* =========================
   OPEN PLAYER
========================= */

async function openPlayer(video){

    /*
     * Reset the view-count state
     * for this new video opening.
     */

    currentViewVideoId =
        video.id;

    viewCountedForCurrentVideo =
        false;


    playerTitle.textContent =
        video.title ||
        "Video";


    playerCategory.textContent =
        video.category ||
        "";


    playerDescription.textContent =
        video.description ||
        "";


    /*
     * Completely reset the player.
     */

    playerVideo.pause();

    playerVideo.removeAttribute(
        "src"
    );

    playerVideo.load();


    videoModal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    /*
     * IMPORTANT:
     *
     * The playing event is registered
     * BEFORE play() is called.
     *
     * This fixes the problem where the
     * Mini App could miss the event.
     */

    playerVideo.onplaying =
        function(){

            console.log(
                "VIDEO STARTED — COUNTING VIEW"
            );


            if(
                currentViewVideoId !==
                video.id
            ){

                return;

            }


            if(
                viewCountedForCurrentVideo
            ){

                return;

            }


            viewCountedForCurrentVideo =
                true;


            updateViews(video);

        };


    /*
     * Get the secure video URL.
     */

    const videoURL =
        await getVideoURL(video);


    /*
     * Make sure the player wasn't
     * closed while the URL was loading.
     */

    if(
        currentViewVideoId !==
        video.id
    ){

        return;

    }


    if(!videoURL){

        closeVideoPlayer();


        alert(
            "Unable to load this video."
        );


        return;

    }


    /*
     * Set the video source.
     */

    playerVideo.src =
        videoURL;


    playerVideo.load();


    /*
     * Try autoplay.
     *
     * If autoplay is blocked,
     * the user can press Play.
     *
     * The "playing" event above will
     * still count the view.
     */

    try{

        await playerVideo.play();

    }
    catch(error){

        console.log(
            "Autoplay blocked. User can press Play."
        );

    }

}


/* =========================
   UPDATE VIEWS
========================= */

async function updateViews(video){

    /*
     * Prevent duplicate requests
     * for the same opening.
     */

    if(!video || !video.id){

        return;

    }


    try{

        console.log(
            "Counting view for video:",
            video.id
        );


        const { data, error } =
            await supabaseClient.rpc(
                "increment_video_views",
                {
                    p_video_id: video.id
                }
            );


        if(error){

            console.error(
                "View counter RPC error:",
                error
            );

            /*
             * Allow another attempt if
             * the database request failed.
             */

            viewCountedForCurrentVideo =
                false;

            return;

        }


        /*
         * Supabase RPC returns the new
         * database view count.
         */

        const newViewCount =
            Number(data || 0);


        console.log(
            "View counted successfully. New count:",
            newViewCount
        );


        /*
         * Update the local object.
         */

        video.views =
            newViewCount;


        /*
         * Update the visible card.
         */

        const viewElement =
            document.querySelector(
                `.view-count-${CSS.escape(String(video.id))}`
            );


        if(viewElement){

            viewElement.textContent =
                newViewCount.toLocaleString() +
                " views";

        }

    }
    catch(error){

        console.error(
            "Unexpected view update error:",
            error
        );


        /*
         * If something unexpected happened,
         * allow another playback attempt
         * to count the view.
         */

        viewCountedForCurrentVideo =
            false;

    }

}


/* =========================
   CLOSE VIDEO PLAYER
========================= */

function closeVideoPlayer(){

    /*
     * Stop any future view-count
     * callbacks for the closed video.
     */

    currentViewVideoId =
        null;

    viewCountedForCurrentVideo =
        false;


    /*
     * Remove the playing handler.
     */

    playerVideo.onplaying =
        null;


    /*
     * Stop video.
     */

    playerVideo.pause();


    playerVideo.removeAttribute(
        "src"
    );


    playerVideo.load();


    /*
     * Close modal.
     */

    videoModal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

}


/* =========================
   CLOSE BUTTON
========================= */

closePlayer.addEventListener(
    "click",
    closeVideoPlayer
);


/* =========================
   MODAL BACKGROUND
========================= */

videoModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            videoModal
        ){

            closeVideoPlayer();

        }

    }
);


/* =========================
   ESCAPE KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            if(
                videoModal.classList.contains(
                    "show"
                )
            ){

                closeVideoPlayer();

            }


            categorySuggestions.style.display =
                "none";

        }

    }
);


/* =========================
   DISABLE VIDEO RIGHT CLICK
========================= */

playerVideo.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

    }
);


/* =========================
   DISABLE IMAGE RIGHT CLICK
========================= */

document.addEventListener(
    "contextmenu",
    function(event){

        if(
            event.target.tagName === "IMG"
        ){

            event.preventDefault();

        }

    }
);


/* =========================
   DISABLE VIDEO DRAG
========================= */

playerVideo.addEventListener(
    "dragstart",
    function(event){

        event.preventDefault();

    }
);


/* =========================
   CATEGORY BUTTONS
========================= */

document
    .getElementById("categories")
    .addEventListener(
        "click",
        function(event){

            const button =
                event.target.closest(
                    ".category"
                );


            if(!button){

                return;

            }


            document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


            button.classList.add(
                "active"
            );


            currentCategory =
                button.dataset.category;


            searchInput.value =
                "";

            searchTerm =
                "";


            clearSearch.style.display =
                "none";


            categorySuggestions.style.display =
                "none";


            renderVideos();

        }
    );


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    function(){

        const value =
            this.value.trim();


        searchTerm =
            value.toLowerCase();


        if(value){

            clearSearch.style.display =
                "flex";

        }
        else{

            clearSearch.style.display =
                "none";

        }


        showCategorySuggestions(
            value
        );


        const matchingCategory =
            categories.find(
                category =>
                    category.toLowerCase() ===
                    value.toLowerCase()
            );


        if(
            matchingCategory &&
            matchingCategory !== "All"
        ){

            currentCategory =
                matchingCategory;


            document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "active",
                            button.dataset.category
                                .toLowerCase() ===
                            matchingCategory
                                .toLowerCase()
                        );

                    }
                );

        }

        else if(!value){

            currentCategory =
                "All";


            document
                .querySelectorAll(
                    ".category"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "active",
                            button.dataset.category ===
                            "All"
                        );

                    }
                );

        }


        renderVideos();

    }
);


/* =========================
   CATEGORY SUGGESTIONS
========================= */

function showCategorySuggestions(
    value
){

    if(!value){

        categorySuggestions.style.display =
            "none";

        return;

    }


    const search =
        value.toLowerCase();


    const matches =
        categories.filter(
            category =>
                category
                    .toLowerCase()
                    .includes(search)
        );


    if(matches.length === 0){

        categorySuggestions.style.display =
            "none";

        return;

    }


    categorySuggestions.innerHTML =
        "";


    matches.forEach(
        category => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "category-suggestion";


            item.innerHTML =
                `
                <span>●</span>
                ${escapeHTML(category)}
                `;


            item.addEventListener(
                "click",
                function(){

                    searchInput.value =
                        category;


                    searchTerm =
                        category.toLowerCase();


                    currentCategory =
                        category;


                    document
                        .querySelectorAll(
                            ".category"
                        )
                        .forEach(
                            button => {

                                button.classList.toggle(
                                    "active",
                                    button.dataset.category ===
                                    category
                                );

                            }
                        );


                    categorySuggestions.style.display =
                        "none";


                    clearSearch.style.display =
                        "flex";


                    renderVideos();

                }
            );


            categorySuggestions.appendChild(
                item
            );

        }
    );


    categorySuggestions.style.display =
        "block";

}


/* =========================
   CLEAR SEARCH
========================= */

clearSearch.addEventListener(
    "click",
    function(){

        searchInput.value =
            "";

        searchTerm =
            "";

        currentCategory =
            "All";


        clearSearch.style.display =
            "none";


        categorySuggestions.style.display =
            "none";


        document
            .querySelectorAll(
                ".category"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.category ===
                        "All"
                    );

                }
            );


        renderVideos();

        searchInput.focus();

    }
);


/* =========================
   CLICK OUTSIDE SEARCH
========================= */

document.addEventListener(
    "click",
    function(event){

        if(
            !event.target.closest(
                ".search-wrapper"
            )
        ){

            categorySuggestions.style.display =
                "none";

        }

    }
);


/* =========================
   LOADING
========================= */

function showLoading(){

    videoGrid.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <span>
                Loading videos...
            </span>

        </div>

    `;

}


/* =========================
   EMPTY
========================= */

function showEmpty(){

    videoGrid.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🎬
            </div>

            <h3>
                No videos found
            </h3>

            <p>
                Try another category or search term.
            </p>

        </div>

    `;

}


/* =========================
   ERROR
========================= */

function showError(message){

    videoGrid.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                ⚠️
            </div>

            <h3>
                Something went wrong
            </h3>

            <p>
                ${escapeHTML(message)}
            </p>

        </div>

    `;


    resultCount.textContent =
        "Error";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   START
========================= */

loadVideos();

</script>
