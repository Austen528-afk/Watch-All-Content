```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 25px;

    background:#111;
    border-bottom:1px solid #252525;
}

.logo{
    font-size:28px;
    font-weight:800;
}

.logo span{
    color:#ff1744;
}

.admin-btn{
    text-decoration:none;
    color:white;
    background:#ff1744;

    padding:10px 16px;
    border-radius:8px;

    font-size:13px;
}

.admin-btn:hover{
    background:#e90035;
}

/* CATEGORY BAR */

.category-section{
    padding:20px 25px;

    background:#0d0d0d;
    border-bottom:1px solid #222;
}

.category-title{
    color:#888;
    font-size:13px;
    margin-bottom:12px;
}

.categories{
    display:flex;
    gap:10px;

    overflow-x:auto;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{
    flex-shrink:0;

    border:1px solid #333;
    background:#171717;
    color:#aaa;

    padding:10px 17px;

    border-radius:25px;

    cursor:pointer;

    font-size:13px;

    transition:.2s;
}

.category-btn:hover{
    color:white;
    border-color:#ff1744;
}

.category-btn.active{
    background:#ff1744;
    border-color:#ff1744;
    color:white;
}

/* MAIN */

.container{
    padding:25px;
}

.heading{
    margin-bottom:22px;
}

.heading h1{
    font-size:23px;
}

.heading p{
    color:#777;
    font-size:12px;
    margin-top:6px;
}

#currentCategory{
    color:#ff1744;
}

/* VIDEO GRID */

.video-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

    gap:20px;
}

/* CARD */

.card{
    background:#151515;

    border:1px solid #252525;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#444;
}

.thumbnail{
    width:100%;
    height:180px;

    background:#222;

    position:relative;
}

.thumbnail img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.category-label{
    position:absolute;

    top:10px;
    left:10px;

    background:rgba(0,0,0,.8);

    padding:5px 8px;

    border-radius:5px;

    font-size:10px;
}

.play-button{
    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.2);

    opacity:0;

    transition:.2s;
}

.card:hover .play-button{
    opacity:1;
}

.play-circle{
    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#ff1744;

    font-size:20px;
}

.card-content{
    padding:15px;
}

.card-content h3{
    font-size:15px;
    margin-bottom:7px;
}

.card-content p{
    color:#888;
    font-size:12px;
    line-height:1.5;
}

/* MESSAGE */

.message{
    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:#777;
}

.message-icon{
    font-size:42px;
    margin-bottom:15px;
}

.message h3{
    color:#aaa;
}

/* PLAYER */

.player-modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.95);
}

.player-box{
    width:100%;
    max-width:1000px;
}

.player-box video{
    width:100%;

    max-height:75vh;

    background:#000;

    border-radius:12px;
}

.close-btn{
    margin-bottom:10px;

    border:none;

    background:#ff1744;

    color:white;

    padding:10px 15px;

    border-radius:8px;

    cursor:pointer;
}

.player-info{
    padding-top:15px;
}

.player-info h2{
    margin-bottom:7px;
}

.player-info p{
    color:#888;
    font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:15px;
    }

    .logo{
        font-size:23px;
    }

    .category-section{
        padding:15px;
    }

    .container{
        padding:15px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

    .thumbnail{
        height:210px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        Stream<span>X</span>
    </div>

    <a
        href="admin.html"
        class="admin-btn"
    >
        Admin
    </a>

</header>


<!-- CATEGORIES -->

<section class="category-section">

    <div class="category-title">
        Choose a category
    </div>

    <div class="categories">

        <button
            class="category-btn active"
            onclick="selectCategory('All',this)"
        >
            🎬 All Videos
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Trending',this)"
        >
            🔥 Trending
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Entertainment',this)"
        >
            🎭 Entertainment
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Music',this)"
        >
            🎵 Music
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Sports',this)"
        >
            ⚽ Sports
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Gaming',this)"
        >
            🎮 Gaming
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Education',this)"
        >
            🎓 Education
        </button>

        <button
            class="category-btn"
            onclick="selectCategory('Lifestyle',this)"
        >
            ✨ Lifestyle
        </button>

    </div>

</section>


<!-- CONTENT -->

<main class="container">

    <div class="heading">

        <h1>
            <span id="currentCategory">
                All Videos
            </span>
        </h1>

        <p>
            Select a category to view its content.
        </p>

    </div>


    <div
        id="videoGrid"
        class="video-grid"
    >

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h3>
                Loading videos...
            </h3>

        </div>

    </div>

</main>


<!-- VIDEO PLAYER -->

<div
    class="player-modal"
    id="playerModal"
>

    <div class="player-box">

        <button
            class="close-btn"
            onclick="closePlayer()"
        >
            ✕ Close
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

        <div class="player-info">

            <h2 id="playerTitle">
                Video
            </h2>

            <p id="playerDescription"></p>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://iojjmoywrlnzpyatahyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   CATEGORY
===================================================== */

let selectedCategory = "All";


async function selectCategory(
    category,
    button
){

    selectedCategory = category;


    /* Update buttons */

    document
        .querySelectorAll(".category-btn")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );


    button.classList.add("active");


    /* Update heading */

    document.getElementById(
        "currentCategory"
    ).textContent =
        category === "All"
            ? "All Videos"
            : category;


    /* Load selected category */

    await loadVideos();

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

    const grid =
        document.getElementById(
            "videoGrid"
        );


    grid.innerHTML = `

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h3>
                Loading ${escapeHTML(selectedCategory)}
                videos...
            </h3>

        </div>

    `;


    try{

        let query =
            supabase
            .from("videos")
            .select("*");


        /*
        ================================================
        ALL VIDEOS
        ================================================
        */

        if(selectedCategory === "All"){

            query =
                query.order(
                    "created_at",
                    {
                        ascending:false
                    }
                );

        }


        /*
        ================================================
        SPECIFIC CATEGORY
        ================================================
        */

        else{

            query =
                query
                .ilike(
                    "category",
                    selectedCategory
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );

        }


        const {
            data,
            error
        } = await query;


        if(error){

            console.error(
                "Supabase error:",
                error
            );


            grid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>

                    <h3>
                        Unable to load videos
                    </h3>

                    <p style="margin-top:10px;">
                        ${escapeHTML(error.message)}
                    </p>

                </div>

            `;

            return;

        }


        if(!data || data.length === 0){

            grid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        🎬
                    </div>

                    <h3>
                        No videos in this category
                    </h3>

                    <p style="margin-top:10px;">
                        No ${escapeHTML(selectedCategory)}
                        content has been uploaded yet.
                    </p>

                </div>

            `;

            return;

        }


        displayVideos(data);

    }

    catch(error){

        console.error(
            "Unexpected error:",
            error
        );


        grid.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ⚠️
                </div>

                <h3>
                    Connection error
                </h3>

                <p style="margin-top:10px;">
                    Please refresh the page.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   DISPLAY VIDEOS
===================================================== */

function displayVideos(videos){

    const grid =
        document.getElementById(
            "videoGrid"
        );


    grid.innerHTML = "";


    videos.forEach(
        video => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const thumbnail =
                video.thumbnail_url ||

                "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


            card.innerHTML = `

                <div class="thumbnail">

                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="${escapeHTML(video.title || "Video")}"
                        loading="lazy"
                    >

                    <div class="category-label">
                        ${escapeHTML(video.category || "")}
                    </div>


                    <div class="play-button">

                        <div class="play-circle">
                            ▶
                        </div>

                    </div>

                </div>


                <div class="card-content">

                    <h3>
                        ${escapeHTML(
                            video.title ||
                            "Untitled Video"
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            video.description ||
                            ""
                        )}
                    </p>

                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    openPlayer(video);

                }
            );


            grid.appendChild(card);

        }
    );

}


/* =====================================================
   VIDEO PLAYER
===================================================== */

function openPlayer(video){

    if(!video.video_url){

        alert(
            "This video does not have a valid video URL."
        );

        return;

    }


    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.src =
        video.video_url;


    document.getElementById(
        "playerTitle"
    ).textContent =
        video.title ||
        "Video";


    document.getElementById(
        "playerDescription"
    ).textContent =
        video.description ||
        "";


    modal.style.display =
        "flex";


    player.play()
        .catch(
            () => {}
        );

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

    const modal =
        document.getElementById(
            "playerModal"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.removeAttribute(
        "src"
    );

    player.load();


    modal.style.display =
        "none";

}


/* =====================================================
   CLOSE MODAL BY CLICKING OUTSIDE
===================================================== */

document
    .getElementById("playerModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closePlayer();

            }

        }
    );


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /[&<>"']/g,
            function(character){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[character];

            }
        );

}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>

</body>
</html>
