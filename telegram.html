<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #080808;
    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

.header {
    height: 64px;

    padding: 0 16px;

    background: #111111;

    border-bottom:
        1px solid #252525;

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.logo {
    font-size: 24px;

    font-weight: 900;

    letter-spacing: -1px;
}

.logo span {
    color: #ff1744;
}

.user {
    max-width: 160px;

    color: #aaaaaa;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   AGE GATE
========================= */

.age-gate {

    min-height:
        calc(100vh - 64px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}


.age-card {

    width: 100%;

    max-width: 420px;

    background: #111111;

    border:
        1px solid #292929;

    border-radius: 20px;

    padding: 30px 24px;

    text-align: center;

    box-shadow:
        0 15px 50px
        rgba(0, 0, 0, 0.45);
}


/* =========================
   AGE ICON
========================= */

.age-icon {

    width: 75px;

    height: 75px;

    margin:
        0 auto 20px;

    border-radius: 50%;

    background: #1c1c1c;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;
}


/* =========================
   TITLE
========================= */

.age-card h1 {

    font-size: 28px;

    margin-bottom: 15px;

    line-height: 1.2;
}


/* =========================
   DESCRIPTION
========================= */

.age-description {

    color: #999999;

    line-height: 1.6;

}


/* =========================
   BUTTONS
========================= */

.age-button {

    width: 100%;

    min-height: 52px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    margin-top: 10px;

    display: block;

    transition:
        transform 0.1s ease,
        opacity 0.2s ease;
}


.age-button:active {

    transform:
        scale(0.98);
}


.age-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}


/* 18+ */

.btn-adult {

    background: #ff1744;

    color: #ffffff;
}


.btn-adult:hover {

    opacity: 0.9;
}


/* Under 18 */

.btn-under {

    background: #292929;

    color: #ffffff;
}


.btn-under:hover {

    background: #333333;
}


/* =========================
   CONTENT
========================= */

.content {

    display: none;

    padding: 20px;

    max-width: 1000px;

    margin: auto;
}


.hero {

    background: #111111;

    border:
        1px solid #252525;

    border-radius: 18px;

    padding: 25px;
}


.hero h2 {

    margin-bottom: 10px;
}


.hero p {

    color: #999999;

}

   ACCESS DENIED

.denied-card {

.denied-icon {

   MOBILE
========================= */

@media (max-width: 500px) {

    .header {

        padding:
            0 13px;
    }

    .logo {

        font-size: 22px;
    }

    .user {

        max-width: 130px;
    }

    .age-gate {

        padding:
            15px;
    }

    .age-card {

        padding:
            28px 20px;

    .age-card h1 {

        font-size:
            25px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">

        Stream<span>X</span>

    </div>


    <div
        class="user"
        id="userName"
    >

        Telegram User

    </div>

</header>



<!-- =========================
     AGE VERIFICATION
========================= -->

<section
    class="age-gate"
    id="ageGate"
>

    <div class="age-card">


        <div class="age-icon">

            🔞

        </div>


        <h1>

            Age Verification

        </h1>


        <p class="age-description">

            This platform contains adult content.
            You must be 18 years or older to continue.

        </p>


        <!-- =====================
             18+ BUTTON
        ====================== -->

        <button
            type="button"
            class="age-button btn-adult"
            id="btn18"
        >

            I Am 18+

        </button>


        <!-- =====================
             UNDER 18 BUTTON
        ====================== -->

        <button
            type="button"
            class="age-button btn-under"
            id="btnUnder18"
        >

            Under 18

        </button>


    </div>

</section>



<!-- =========================
     STREAMX CONTENT
========================= -->

<section
    class="content"
    id="contentArea"
>

    <div class="hero">

        <h2>

            Welcome to StreamX

        </h2>


        <p>

            Age verification successful.
            Your StreamX content will appear here.

        </p>

    </div>


    <!--
        ACTUAL STREAMX
        CATEGORIES AND VIDEOS
        WILL BE INSERTED HERE.
    -->

</section>



<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://iojjmoywrlnzpyatahyh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_r13yibx1-cPJ7nod29-oAA_eqs-x8qL";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

let supabaseClient = null;

try {

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

} catch (error) {

    console.error(
        "Supabase initialization error:",
        error
    );

}


/* =====================================================
   TELEGRAM USER
===================================================== */

let telegramUser = null;


/* =====================================================
   ELEMENTS
===================================================== */

const ageGate =
    document.getElementById(
        "ageGate"
    );


const contentArea =
    document.getElementById(
        "contentArea"
    );


const userName =
    document.getElementById(
        "userName"
    );


const btn18 =
    document.getElementById(
        "btn18"
    );


const btnUnder18 =
    document.getElementById(
        "btnUnder18"
    );


/* =====================================================
   SHOW AGE GATE
===================================================== */

function showAgeGate() {

    ageGate.style.display =
        "flex";

    contentArea.style.display =
        "none";

}


/* =====================================================
   SHOW CONTENT
===================================================== */

function showContent() {

    ageGate.style.display =
        "none";

    contentArea.style.display =
        "block";

}


/* =====================================================
   SHOW ACCESS DENIED
===================================================== */

function showDenied() {

    document.body.innerHTML = `

        <div class="denied">

            <div class="denied-card">

                <div class="denied-icon">
                    🔞
                </div>

                <h2>
                    Access Denied
                </h2>

                <p>
                    This platform is available only
                    to users aged 18 and above.
                </p>

            </div>

        </div>

    `;

}


/* =====================================================
   INITIALIZE TELEGRAM
===================================================== */

function initializeTelegram() {

    try {

        const tg =
            window.Telegram?.WebApp;


        /*
         * If Telegram is available,
         * initialize it.
         */

        if (tg) {

            tg.ready();

            tg.expand();


            telegramUser =
                tg.initDataUnsafe?.user;


            if (telegramUser) {

                let name =
                    telegramUser.first_name ||
                    "Telegram User";


                if (
                    telegramUser.last_name
                ) {

                    name +=
                        " " +
                        telegramUser.last_name;

                }


                userName.textContent =
                    name;

            }

        }

    } catch (error) {

        console.error(
            "Telegram error:",
            error
        );

    }


    /*
     * IMPORTANT:
     *
     * The age gate remains visible
     * regardless of initialization.
     */

    showAgeGate();


    /*
     * If we have a Telegram user
     * and Supabase is available,
     * save/check the account.
     */

    if (
        telegramUser &&
        supabaseClient
    ) {

        saveAndCheckUser();

    }

}


/* =====================================================
   SAVE TELEGRAM USER
===================================================== */

async function saveAndCheckUser() {

    try {

        const telegramId =
            telegramUser.id.toString();


        /*
         * First check whether
         * this user already exists.
         */

        const { data, error } =
            await supabaseClient

            .from("users")

            .select(
                "age_verified, access_granted"
            )

            .eq(
                "telegram_id",
                telegramId
            )

            .maybeSingle();


        if (error) {

            console.error(
                "User lookup error:",
                error
            );

            return;

        }


        /*
         * Existing verified user.
         */

        if (
            data &&
            data.age_verified === true &&
            data.access_granted === true
        ) {

            showContent();

            /*
             * Update last seen.
             */

            await supabaseClient

                .from("users")

                .update({
                    last_seen:
                        new Date().toISOString()
                })

                .eq(
                    "telegram_id",
                    telegramId
                );

            return;

        }


        /*
         * New user.
         */

        if (!data) {

            const { error:
                insertError
            } = await supabaseClient

                .from("users")

                .insert({

                    telegram_id:
                        telegramId,

                    username:
                        telegramUser.username || "",

                    first_name:
                        telegramUser.first_name || "",

                    last_name:
                        telegramUser.last_name || "",

                    age_verified:
                        false,

                    access_granted:
                        false,

                    last_seen:
                        new Date().toISOString()

                });


            if (insertError) {

                console.error(
                    "User insert error:",
                    insertError
                );

            }

        }


        /*
         * User is not verified.
         *
         * Keep BOTH buttons visible.
         */

        showAgeGate();

    }

    catch (error) {

        console.error(
            "User check error:",
            error
        );

        /*
         * Do NOT hide the age buttons.
         */

        showAgeGate();

    }

}


/* =====================================================
   18+ BUTTON
===================================================== */

btn18.addEventListener(
    "click",
    async function () {


        /*
         * Telegram user required.
         */

        if (!telegramUser) {

            alert(
                "Please open StreamX from inside Telegram."
            );

            return;

        }


        /*
         * Supabase required.
         */

        if (!supabaseClient) {

            alert(
                "Unable to connect to StreamX."
            );

            return;

        }


        /*
         * Disable buttons while saving.
         */

        btn18.disabled =
            true;

        btnUnder18.disabled =
            true;

        btn18.textContent =
            "Saving...";


        try {

            const telegramId =
                telegramUser.id.toString();


            const { error } =
                await supabaseClient

                .from("users")

                .update({

                    age_verified:
                        true,

                    access_granted:
                        true,

                    last_seen:
                        new Date().toISOString()

                })

                .eq(
                    "telegram_id",
                    telegramId
                );


            if (error) {

                console.error(
                    "Verification error:",
                    error
                );


                throw error;

            }


            /*
             * Verification successful.
             */

            showContent();

        }

        catch (error) {

            console.error(error);


            alert(
                "Your age verification could not be saved. Please try again."
            );


            btn18.disabled =
                false;

            btnUnder18.disabled =
                false;

            btn18.textContent =
                "I Am 18+";

        }

    }
);


/* =====================================================
   UNDER 18 BUTTON
===================================================== */

btnUnder18.addEventListener(
    "click",
    async function () {


        /*
         * Disable both buttons.
         */

        btn18.disabled =
            true;

        btnUnder18.disabled =
            true;

        btnUnder18.textContent =
            "Saving...";


        try {

            /*
             * Save denial if Telegram
             * user is available.
             */

            if (
                telegramUser &&
                supabaseClient
            ) {

                const telegramId =
                    telegramUser.id.toString();


                const { error } =
                    await supabaseClient

                    .from("users")

                    .update({

                        age_verified:
                            false,

                        access_granted:
                            false,

                        last_seen:
                            new Date().toISOString()

                    })

                    .eq(
                        "telegram_id",
                        telegramId
                    );


                if (error) {

                    console.error(
                        "Under 18 update error:",
                        error
                    );

                }

            }


            /*
             * Block the user.
             */

            showDenied();

        }

        catch (error) {

            console.error(error);

            /*
             * Even if saving fails,
             * do not give access.
             */

            showDenied();

        }

    }
);


/* =====================================================
   START
===================================================== */

initializeTelegram();


</script>

</body>

</html>
