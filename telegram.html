<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>StreamX</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#080808;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
}

.header{
padding:16px;
border-bottom:1px solid #222;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:24px;
font-weight:900;
}

.logo span{
color:#ff1744;
}

.user{
font-size:12px;
color:#aaa;
}

.age-gate{
min-height:calc(100vh - 70px);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:#111;
border:1px solid #222;
border-radius:18px;
padding:30px;
text-align:center;
}

.card h1{
margin-bottom:15px;
font-size:28px;
}

.card p{
color:#999;
line-height:1.6;
margin-bottom:25px;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.btn18{
background:#ff1744;
color:white;
}

.btn18:hover{
opacity:.9;
}

.btnUnder{
background:#222;
color:white;
}

.content{
display:none;
padding:20px;
}

.hero{
background:#111;
border:1px solid #222;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.hero h2{
margin-bottom:10px;
}

.hero p{
color:#999;
line-height:1.6;
}

.denied{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
text-align:center;
padding:30px;
font-size:20px;
}

</style>
</head>

<body>

<div class="header">

<div class="logo">
Stream<span>X</span>
</div>

<div class="user" id="userName">
Telegram User
</div>

</div>


<div class="age-gate" id="ageGate">

<div class="card">

<h1>🔞 Age Verification</h1>

<p>
This platform contains adult content.
You must be 18 years or older to continue.
</p>

<button
class="btn btn18"
id="btn18">
I Am 18+
</button>

<button
class="btn btnUnder"
id="btnUnder18">
Under 18
</button>

</div>

</div>


<div class="content" id="contentArea">

<div class="hero">

<h2>Welcome to StreamX</h2>

<p>
Age verification successful.
Your streaming content will appear here.
</p>

</div>

<!--
YOUR STREAMX VIDEO GRID
GOES HERE
-->

</div>


<script>

const tg = window.Telegram?.WebApp;

if(tg){

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if(user){

let name =
user.first_name || "Telegram User";

if(user.last_name){

name += " " + user.last_name;

}

document.getElementById("userName")
.textContent = name;

}

}


const ageGate =
document.getElementById("ageGate");

const contentArea =
document.getElementById("contentArea");

document
.getElementById("btn18")
.addEventListener("click",()=>{

ageGate.style.display="none";

contentArea.style.display="block";

});


document
.getElementById("btnUnder18")
.addEventListener("click",()=>{

document.body.innerHTML=`

<div class="denied">

<div>

<h2>Access Denied</h2>

<br>

<p>
This platform is available only
to users aged 18 and above.
</p>

</div>

</div>

`;

});

</script>

</body>
</html>
