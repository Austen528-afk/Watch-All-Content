<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>StreamX</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            padding-bottom: 30px;
        }

        /* HEADER */

        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(8, 8, 8, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #222;
        }

        .header-inner {
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo span {
            color: #ff1744;
        }

        .telegram-user {
            display: none;
            align-items: center;
            gap: 7px;
            color: #aaa;
            font-size: 11px;
        }

        .user-dot {
            width: 7px;
            height: 7px;
            background: #21c477;
            border-radius: 50%;
            box-shadow: 0 0 10px #21c477;
        }

        /* HERO */

        .hero {
            margin: 16px;
            padding: 25px 20px;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #171717,
                #0d0d0d
            );
            border: 1px solid #262626;
        }

        .hero h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .hero h1 span {
            color: #ff1744;
        }

        .hero p {
            color: #888;
            font-size: 12px;
            line-height: 1.6;
        }

        /* STATUS */

        .status {
            margin: 20px 16px;
            padding: 12px 15px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 10px;
            color: #777;
            font-size: 11px;
        }

        .status strong {
            color: #21c477;
        }

        /* TEST BUTTON */

        .test-button {
            display: block;
            width: calc(100% - 32px);
            margin: 20px 16px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff1744;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .test-button:active {
            transform: scale(0.98);
        }

        /* FOOTER */

        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: #555;
            font-size: 10px;
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-inner">

            <div class="logo">
                Stream<span>X</span>
            </div>

            <div
                class="telegram-user"
                id="telegramUser"
            >
                <span class="user-dot"></span>
                <span id="userName">Telegram</span>
            </div>

        </div>
    </header>


    <section class="hero">

        <h1>
            Welcome to
            <span>StreamX</span>
        </h1>

        <p>
            Your StreamX Telegram Mini App is
            connected and ready.
        </p>

    </section>


    <div
        class="status"
        id="status"
    >
        Checking Telegram connection...
    </div>


    <button
        class="test-button"
        id="testButton"
        type="button"
    >
        Test Telegram Mini App
    </button>


    <footer class="footer">
        © 2026 StreamX
    </footer>

</div>


<script>

    /*
    ========================================
    TELEGRAM MINI APP
    ========================================
    */

    const tg = window.Telegram?.WebApp;

    const status =
        document.getElementById("status");

    const telegramUser =
        document.getElementById("telegramUser");

    const userName =
        document.getElementById("userName");

    const testButton =
        document.getElementById("testButton");


    /*
    ========================================
    INITIALIZE TELEGRAM
    ========================================
    */

    if (tg) {

        tg.ready();

        tg.expand();

        status.innerHTML =
            "<strong>Connected</strong> — Telegram Mini App is working.";

        /*
        Telegram user information
        */

        const user =
            tg.initDataUnsafe?.user;

        if (user) {

            telegramUser.style.display =
                "flex";

            let displayName =
                user.first_name || "Telegram";

            if (user.last_name) {

                displayName +=
                    " " + user.last_name;

            }

            userName.textContent =
                displayName;
        }

    } else {

        status.innerHTML =
            "⚠️ Open this page inside Telegram to use the Mini App.";

    }


    /*
    ========================================
    TEST BUTTON
    ========================================
    */

    testButton.addEventListener(
        "click",
        function () {

            if (!tg) {

                alert(
                    "This page is not running inside Telegram."
                );

                return;
            }

            tg.showAlert(
                "StreamX Telegram Mini App is working!"
            );

        }
    );

</script>

</body>
</html>
